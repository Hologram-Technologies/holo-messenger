spec = "lexlean/project/1"
name = "prism-text-request"
language = "1.2"
module_prefix = "PrismTextRequest"
source_roots = ["src"]
entrypoints = ["src/TextRequest.lex.tex", "src/Messenger/Budget.lex.tex", "src/Messenger/Composer.lex.tex", "src/Messenger/Invite.lex.tex", "src/Messenger/Keys.lex.tex", "src/Messenger/Layout.lex.tex", "src/Messenger/Membership.lex.tex", "src/Messenger/Menu.lex.tex", "src/Messenger/Navigation.lex.tex", "src/Messenger/Notify.lex.tex", "src/Messenger/Overlay.lex.tex", "src/Messenger/Render.lex.tex", "src/Messenger/RoomList.lex.tex", "src/Messenger/Search.lex.tex", "src/Messenger/Session.lex.tex", "src/Messenger/Settings.lex.tex", "src/Messenger/Timeline.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
