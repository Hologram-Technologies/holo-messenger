# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# A row that specifies a public failure declares its error type (R5):
#
#   failure   the error type, as written in `Result<_, E>`
#   negative  the ID of the `build` row whose test provokes the refusal and
#             observes it; this row's own ID when the row is that claim
#
# `cargo xtask audit-limits` lets a shipped crate name an error type in a
# `Result` only when a row here declares it and the negative test exists. A type
# is declared once. Nothing else sanctions a type: there is no list in the gate.
#
# The first row is the template's own Prism application in `app/` (MR-08).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "MR-01"
level = "build"
suite = "rules"
statement = "The main screen shows only with an identity and the tab lock, and an unsupported browser always gets the fatal page"

[[id]]
id = "MR-02"
level = "build"
suite = "rules"
statement = "A muted room, an own message and the room being viewed never notify"

[[id]]
id = "MR-03"
level = "build"
suite = "rules"
statement = "A non-member is offered only copy, and edit is offered only on an own message"

[[id]]
id = "MR-04"
level = "build"
suite = "rules"
statement = "A link never lands a non-member in a timeline, and an unknown link goes home"

[[id]]
id = "MR-05"
level = "build"
suite = "rules"
statement = "Shift and Enter never sends, and Enter completes a suggestion while the popup is open"

[[id]]
id = "MR-06"
level = "build"
suite = "rules"
statement = "Unknown markup never renders and an unsafe link scheme never opens"

[[id]]
id = "MR-07"
level = "build"
suite = "rules"
statement = "The layout has one to three panes, and a phone never shows the list and the timeline together"

[[id]]
id = "MR-08"
level = "build"
suite = "rules"
statement = "The application answers each of its seven questions with the function the theorems are about, and invalid request for anything else"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "FR-02"
level = "build"
suite = "frame"
statement = "A returning browser whose worker kept an earlier deploy serves this deploy from the navigation that brings its page"

[[id]]
id = "FR-03"
level = "build"
suite = "frame"
statement = "A first visit's bytes are counted once the page has started, the frame's and the app's each within its own budget"

[[id]]
id = "FR-04"
level = "build"
suite = "frame"
statement = "An app's workspace key opens only on a device of the Prism ID that made it, follows the ID when it joins or is recovered, and stays locked on a removed device"

[[id]]
id = "FR-05"
level = "build"
suite = "frame"
statement = "An app's pages on every device of one Prism ID meet on a relay topic only those devices derive, per app, with every message sealed to the ID, and a removed device is left behind"
