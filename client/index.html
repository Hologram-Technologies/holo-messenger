<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prototype of Holo Messenger on sample data: nothing is encrypted, stored on a server or sent.">
<meta name="color-scheme" content="light dark">
<title>Holo Messenger</title>
<style>
/* Layout: tabs (a bar on a phone, a rail on a wide screen), the chat list, the timeline, details. One pane under 768px, details dock at 1200px.
   Type and size are set once, in the block below. Text sizes are in rem, so the device's text size and the Text size setting scale them; heights are least heights, so nothing clips. Spacing is on a 4 and 8 grid. */
:root{
  --title:1.25rem;     /* Budget.titleSize 20 */
  --name:1rem;         /* Budget.nameSize 16 */
  --preview:.9375rem;  /* Budget.previewSize 15 */
  --message:1rem;      /* Budget.messageSize 16 */
  --meta:.75rem;       /* Budget.metaSize 12: times, tab labels, chip text */
  --row:72px;          /* Budget.rowHeight 72: the least height; a row grows with its text */
  --pic:52px;          /* Budget.pictureSize 52 */
  --tabbar:84px;       /* Budget.tabBarHeight 84 */
  --search:52px;       /* Budget.searchHeight 52 */
  --chip:32px;         /* Budget.chipHeight 32 */
  --composer:52px;     /* Budget.composerHeight 52 */
  --round:52px;        /* Budget.roundButtonSize 52 */
  --touch:48px;        /* Budget.touchTarget 48 */
  --bubble:80%;        /* Budget.bubbleMaxPercent 80 */
  --r:12px;            /* cards and bubbles share one radius; pills and pictures are fully round */
  --bg:#FFFFFF; --panel:#F5F6F8; --raise:#FFFFFF; --ink:#11151C; --ink2:#4A5362; --ink3:#7A8494;
  --line:#E4E7EC; --hover:#ECEEF2; --sel:#E4E9FA; --accent:#3046D8; --accent-ink:#FFFFFF;
  --ok:#12805C; --warn:#A8610A; --bad:#C62F3B; --hl:#FBF1CC; --scrim:rgba(17,21,28,.28);
  --shadow:0 12px 32px rgba(17,21,28,.14),0 1px 3px rgba(17,21,28,.08);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
html{font-size:calc(100% * var(--fz,1))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:var(--preview)/1.4 var(--ui);overflow:hidden;display:flow-root;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{height:calc(100% - var(--dh,24px));margin-top:var(--dh,24px);display:grid;grid-template-columns:auto var(--lw,320px) minmax(0,1fr)}
#app.panel-docked{grid-template-columns:auto var(--lw,320px) minmax(0,1fr) 340px}
#app.nolist:not(.you){grid-template-columns:auto minmax(0,1fr)} #app.nolist.panel-docked:not(.you){grid-template-columns:auto minmax(0,1fr) 340px} #app.nolist #list,#app.you #list{display:none} #app.nolist:not(.you) #room{display:flex}
#list,#you,#room,#panel{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
#list,#you{background:var(--panel);border-right:1px solid var(--line)}
#panel{background:var(--panel);border-left:1px solid var(--line)}
#app:not(.panel-docked) #panel{position:fixed;inset:var(--dh,24px) 0 0 auto;width:min(340px,100%);z-index:30;box-shadow:var(--shadow)}
@media (max-width:767px){
  #app,#app.panel-docked,#app.nolist:not(.you),#app.nolist.panel-docked:not(.you){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #app.in-room #list,#app.in-room:not(.you) #nav{display:none} #app:not(.in-room) #room,#app.you #room{display:none}
  #app.nolist:not(.you):not(.in-room) #list{display:flex} #app.nolist:not(.you):not(.in-room) #room,#room [data-nolist]{display:none}   /* a hidden chat list is a wide-screen choice: one pane always shows it */
  #list,#you{border:0;background:var(--bg)}
  #app:not(.panel-docked) #panel{width:100%;background:var(--bg);box-shadow:none} #panel .bar{border:0} #panel .pbody{--b:var(--bg)}
  #app .icon{width:var(--touch);height:var(--touch)}
  .wide{display:none!important}
  .dlg.page{width:100%;height:100%;max-height:none;border-radius:0;background:var(--bg)} .dlg.page .c{--b:var(--bg)} #scrim:has(.page){padding:0} .dlg.page header{padding:4px 16px 4px 4px;min-height:56px}
}
@media (min-width:768px){.narrow{display:none!important}}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
.bar h1,.bar h2{font-size:var(--name);font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .bar,#you .bar{border:0;padding:0 4px 0 16px;gap:0} .bar h1{font-size:var(--title);font-weight:700}
#lbar [data-sel="more"] svg,#moreBtn svg{transform:rotate(90deg)} #lbar svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);flex:none}
.icon:hover{background:var(--hover);color:var(--ink)}
.icon[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
.btn{height:36px;padding:0 16px;border-radius:99px;font-weight:600;border:1px solid var(--line);background:var(--raise)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{height:32px;padding:0 12px;font-size:.8125rem}
button:active,a.btn:active{opacity:.7}
/* avatars */
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:.875rem;flex:none;letter-spacing:0}
.av.s{width:20px;height:20px;font-size:.6875rem} .av.l{width:56px;height:56px;font-size:1.5rem}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#5B7CFA,#22C3C9,#8BD36B,#F4C65B,#F2788F,#9B7BFF,#5B7CFA);display:grid}
.ring .av{box-shadow:0 0 0 2px var(--panel)}

/* chat list: a pill search field, one row of chips, rows with no lines between them */
.search{margin:4px 12px 12px;position:relative;display:block;flex:none}
.search input{width:100%;height:var(--search);border-radius:99px;border:0;background:var(--hover);padding:0 16px 0 48px;font-size:var(--name)}
.search svg{position:absolute;left:16px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--ink3)}
.kbd{font:.75rem var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:var(--panel)}
#flt{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.fc{position:relative;flex:none;height:var(--chip);padding:0 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);font-size:var(--meta);font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:background .15s}
.fc:after{content:"";position:absolute;inset:-8px 0}
.fc[aria-pressed="true"]{background:var(--sel);color:var(--accent);border-color:transparent} .fc i{font-style:normal;font-weight:400}
#rooms{contain:content;flex:1;overflow:auto;padding-bottom:88px;display:flex;flex-direction:column}
.sect{font-size:var(--meta);font-weight:600;color:var(--ink3);padding:12px 16px 4px;display:flex;align-items:center;gap:8px}
.rw{display:flex;gap:12px;align-items:center;min-height:var(--row);padding:8px 16px;text-align:left;width:100%;position:relative;transition:background .15s}
button.rw:hover,.inv:hover{background:var(--hover)} .ri.on,.ri.sel{background:var(--sel)}
.ri{content-visibility:auto;contain-intrinsic-size:auto var(--row)}
.rw .av,.rw .meimg{width:var(--pic);height:var(--pic);font-size:1.25rem}
.rw .t,.rw .row2{display:flex;align-items:center;gap:8px}
.rw .n{display:block;flex:1;min-width:0;font-weight:600;font-size:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tm{font-size:var(--meta);color:var(--ink3);flex:none;font-variant-numeric:tabular-nums} .rw .tm.hi{color:var(--accent);font-weight:600}
.rw .p{display:block;flex:1;min-width:0;color:var(--ink2);font-size:var(--preview);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .p svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px} .dr{color:var(--accent);font-weight:600} .ty{color:var(--accent)} .tk.hi{color:var(--accent)}
.ri.sel:before{content:"✓";position:absolute;left:52px;top:calc(50% + 8px);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--sel)}
.badge{min-width:1.25rem;height:1.25rem;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:var(--meta);font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad);color:var(--bg)} .badge.dot{min-width:10px;width:10px;height:10px;padding:0}
.mut{color:var(--ink3);width:16px;height:16px}
.chev{display:none;color:var(--ink3)} @media (hover:hover) and (min-width:768px){.ri:hover .chev{display:grid}}
.hb{width:auto;margin:0 8px 4px;padding-left:8px;border-radius:var(--r);background:var(--hover)} .hb .p{white-space:normal}
#fx{position:absolute;left:0;top:50%;width:var(--touch);height:var(--touch);margin-top:calc(var(--touch) / -2)} .search #fx svg{position:static;margin:0;color:var(--ink2)} #list.find .search>svg{display:none}
.inv{padding-right:8px} .inv .who{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left} .inv .ok{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--ink3);padding:24px 16px;text-align:center} .empty .btn{margin-top:12px}
#fab{position:absolute;right:16px;bottom:16px;width:var(--round);height:var(--round);border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);z-index:2} #fab svg{width:24px;height:24px}
/* the chat: a top bar, bubbles on a plain ground, one pill and one round button to write with. Spacing on the 4 and 8 grid; bubbles and cards share --r, what sits inside a bubble takes 8 */
#rbar{gap:0;padding:0 4px;height:auto;min-height:56px} @media (min-width:768px){#rbar{padding:0 8px 0 16px}} #rbar svg{width:22px;height:22px} #roomMore svg{transform:rotate(90deg)}
.who{display:flex;align-items:center;gap:12px;min-height:var(--touch);padding:0 8px 0 4px;text-align:left;border-radius:8px} .who .av,.who .meimg{width:40px;height:40px;font-size:1rem}
.who b{display:block;font-size:var(--name);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:var(--meta);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sub:empty{display:none}
#banner{flex:none;flex-wrap:wrap;display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--hl);color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
#tl{flex:1;overflow:hidden auto;padding:8px 0;overflow-anchor:none;contain:content}
.day,.sys{display:flex;justify-content:center;margin:8px 16px;text-align:center}
.day span,.sys>*{padding:4px 12px;border-radius:8px;background:var(--panel);color:var(--ink2);font-size:var(--meta);font-weight:600}
.sys>*{font-weight:400;color:var(--ink3)} .sys svg{width:14px;height:14px;vertical-align:-3px;margin-right:4px} .sys span button{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
.day.new span{background:var(--sel);color:var(--accent)}
.msg{position:relative;display:flex;align-items:flex-start;gap:8px;padding:2px 16px;transition:background .2s}
.msg.first{margin-top:8px} .msg.own{flex-direction:row-reverse} .msg.sel,.msg.act{background:color-mix(in srgb,var(--accent) 16%,transparent)}
@media (pointer:coarse){.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.msg.sw:after{content:"";position:absolute;left:-32px;top:50%;width:24px;height:24px;margin-top:-12px;background:var(--ink2);opacity:var(--sp,0);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M10 7 5 12l5 5M5 12h9a5 5 0 0 1 5 5v1'/></svg>") center/contain no-repeat;-webkit-mask:var(--m);mask:var(--m)}
.mav{width:28px;flex:none} .mav .av{width:28px;height:28px;font-size:.75rem}
.mc{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:min(var(--bubble),640px)} .own .mc{align-items:flex-end}
.bub{position:relative;--b:var(--hover);background:var(--b);border-radius:var(--r);padding:8px 8px 4px 12px;max-width:100%} .own .bub{--b:var(--sel)}
.bub.tail{border-top-left-radius:0} .own .bub.tail{border-radius:var(--r) 0 var(--r) var(--r)}
.bub.tail:before{content:"";position:absolute;top:0;left:-8px;border-top:8px solid var(--b);border-left:8px solid transparent} .own .bub.tail:before{left:auto;right:-8px;border-left:0;border-right:8px solid transparent}
.nm{display:block;font-weight:600;font-size:.8125rem;margin-bottom:2px;text-align:left} .nm:hover{text-decoration:underline}
.fw{font-size:var(--meta);color:var(--ink3);font-style:italic;margin-bottom:2px}
.body{font-size:var(--message);line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap;display:flow-root}
.body.big{font-size:2.5rem;line-height:1.2} .body.nt{color:var(--ink2);font-size:.875rem}
.body code{font:.9em var(--mono);background:color-mix(in srgb,var(--ink) 10%,transparent);padding:1px 4px;border-radius:4px}
.body a{color:var(--accent);text-underline-offset:2px}
.pill{background:var(--sel);color:var(--accent);border-radius:4px;padding:0 4px;font-weight:600} .own .pill{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.pill.me{background:var(--accent);color:var(--accent-ink)}
/* the time, and for your own message its one mark, sit small at the bottom right: on the last line when there is room, under it when there is none */
.meta{float:right;position:relative;z-index:1;display:flex;align-items:center;gap:4px;margin:.4rem 0 0 12px;font-size:var(--meta);line-height:1rem;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums;font-style:normal;font-weight:400}
.meta svg{width:16px;height:16px} .meta button{position:relative;display:grid} .meta button:after{content:"";position:absolute;inset:-12px -6px} .ed{font-style:italic}
.tkb.bad{width:16px;height:16px;border-radius:50%;background:var(--bad);color:var(--bg);font-weight:700;font-size:.6875rem;place-items:center}
.bub.pic{padding:4px} .bub.pic>.nm,.bub.pic>.fw,.bub.pic>.body{margin:4px 4px 0 8px} .bub.pic>.quote{margin-bottom:4px}
.meta.ov{float:none;position:absolute;right:8px;bottom:8px;margin:0;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.quote{display:block;width:100%;text-align:left;margin-bottom:4px;padding:4px 8px;border-left:4px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:.8125rem;color:var(--ink2)}
.quote b{display:block;color:var(--accent)} .quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.chv{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:var(--ink2);opacity:0;pointer-events:none} .chv svg{width:16px;height:16px}
.msg:hover .chv,.chv:focus-visible{opacity:1;pointer-events:auto} @media (hover:none){.chv{display:none}}
.rxc{position:relative;z-index:1;margin:-4px 8px 0;height:24px;padding:0 8px;border-radius:99px;background:var(--hover);box-shadow:0 0 0 2px var(--bg);font-size:.8125rem;display:flex;align-items:center;gap:4px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rxc.mine{background:var(--sel);color:var(--accent)} .rxc:after{content:"";position:absolute;inset:0 0 -8px}
.qrow{position:absolute;z-index:3;bottom:calc(100% - 4px);left:16px;display:flex;background:var(--raise);border-radius:99px;box-shadow:var(--shadow);padding:0 4px;animation:pop .18s} .own .qrow{left:auto;right:16px} .qrow.dn{bottom:auto;top:calc(100% - 4px)}
.qrow button{width:min(var(--touch),calc((100vw - 40px) / 7));height:var(--touch);font-size:1.5rem;display:grid;place-items:center;border-radius:50%} .qrow button.on{background:var(--sel)}
.img{display:block;position:relative} .img img,.img video{background:var(--panel);min-width:96px;min-height:56px;display:block;max-width:min(320px,100%);max-height:240px;border-radius:8px}
.file{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:4px;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);max-width:320px;color:inherit;text-decoration:none;text-align:left}
.file svg{width:24px;height:24px;color:var(--accent)} .file>span{min-width:0} .file small{display:block;color:var(--ink3);font-size:var(--meta)}
.file b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-weight:400}
audio.media{display:block;width:280px;max-width:100%;margin-bottom:4px} .undec{color:var(--ink3);font-style:italic}
.up{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:var(--meta);color:var(--ink3)} .up button{text-decoration:underline}
.intro{margin:24px 16px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.intro h3{margin:0;font-size:var(--title)} .intro p{margin:0;color:var(--ink2);max-width:55ch}

/* composer: the pill holds emoji, the field and attach; one round button outside it sends. A reply or an edit docks on top, inside the same shape */
#comp{flex:none;padding:4px 8px max(8px,env(safe-area-inset-bottom));position:relative}
.crow{display:flex;align-items:flex-end;gap:8px}
.cbox{flex:1;min-width:0;border-radius:calc(var(--composer) / 2);background:var(--hover);overflow:hidden}
@media (hover:hover){.cbox:has(#ta:focus-visible){box-shadow:inset 0 0 0 1px var(--accent)}}
.ctx{display:flex;align-items:center;gap:8px;margin:8px 8px 0;padding:4px 0 4px 8px;border-left:4px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:.8125rem;color:var(--ink2)}
.ctx b{display:block;color:var(--accent)} .ctx span span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pre{padding:8px 16px 0;color:var(--ink2);max-height:88px;overflow:auto}
.cin{display:flex;align-items:flex-end;min-height:var(--composer)} #app .cin .icon{width:var(--touch);height:var(--touch);margin:2px}
#ta{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;font-size:var(--message);line-height:1.4;padding:calc((var(--composer) - 1.4 * var(--message)) / 2) 0;max-height:calc(7 * var(--message) + var(--composer))}
#send{width:var(--round);height:var(--round);border-radius:50%;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:background .15s} #send svg{width:24px;height:24px}
#send:disabled{background:var(--hover);color:var(--ink3);cursor:default}
