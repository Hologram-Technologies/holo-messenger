<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Holo Messenger: private messages with no server.">
<meta name="color-scheme" content="light dark">
<title>Holo Messenger</title>
<style>
/* Layout: three panes on one screen. Chat list, timeline, details. One pane under 768px, details dock at 1200px.
   Every measure is from the series 5, 8, 13, 21, 34, 55. */
:root{
  --bg:#FFFFFF; --panel:#F5F6F8; --raise:#FFFFFF; --ink:#11151C; --ink2:#4A5362; --ink3:#7A8494;
  --line:#E4E7EC; --hover:#ECEEF2; --sel:#E4E9FA; --accent:#3046D8; --accent-ink:#FFFFFF;
  --ok:#12805C; --warn:#A8610A; --bad:#C62F3B; --hl:#FBF1CC; --scrim:rgba(17,21,28,.28);
  --shadow:0 13px 34px rgba(17,21,28,.14),0 1px 3px rgba(17,21,28,.08);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --fs:15px;
}
html{font-size:var(--fs)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 13px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 13px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:.867rem/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{height:100%;display:grid;grid-template-columns:var(--lw,321px) minmax(0,1fr)}
#app.panel-docked{grid-template-columns:var(--lw,321px) minmax(0,1fr) 340px}
#list,#room,#panel{min-width:0;min-height:0;display:flex;flex-direction:column}
#list{background:var(--panel);border-right:1px solid var(--line)}
#panel{background:var(--panel);border-left:1px solid var(--line)}
#app:not(.panel-docked) #panel{position:fixed;inset:0 0 0 auto;width:min(340px,100%);z-index:30;box-shadow:var(--shadow)}
@media (max-width:767px){
  #app,#app.panel-docked{grid-template-columns:minmax(0,1fr)}
  #app.in-room #list{display:none} #app:not(.in-room) #room{display:none}
  #list{border-right:0}
  #app:not(.panel-docked) #panel{width:100%}
  #app .acts{top:auto;bottom:100%;right:13px}
  .msg{padding:2px 13px} .day,.newline{margin-left:13px;margin-right:13px} .sys{margin-left:55px} #comp{padding:0 13px 13px} .typing{padding-left:55px}
  #app .icon{width:42px;height:42px} #comp #send{width:42px;height:42px} #app .acts .icon{width:34px;height:34px}
}
.bar{height:55px;flex:none;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line)}
.bar h1,.bar h2{font-size:1rem;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.icon:hover{background:var(--hover);color:var(--ink)}
.icon[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
.btn{height:34px;padding:0 13px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--raise)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{height:26px;padding:0 8px;font-size:.8rem}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:.867rem;flex:none;letter-spacing:0}
.av.sq{border-radius:8px}
.av.s{width:21px;height:21px;font-size:.667rem} .av.l{width:55px;height:55px;font-size:1.4rem}
.av.me{box-shadow:0 0 0 2px var(--panel),0 0 0 4px transparent;background-clip:padding-box;position:relative}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#5B7CFA,#22C3C9,#8BD36B,#F4C65B,#F2788F,#9B7BFF,#5B7CFA);display:grid}
.ring .av{box-shadow:0 0 0 2px var(--panel)}

/* chat list */
.search{margin:13px;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raise);padding:0 55px 0 34px}
.search svg{position:absolute;left:8px;top:8px;color:var(--ink3)}
.kbd{font:.733rem var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel)}
.search .kbd{position:absolute;right:8px;top:8px}
#rooms{contain:content;flex:1;overflow:auto;padding:0 8px 13px;display:flex;flex-direction:column;gap:1px}
.sect{font-size:.733rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:13px 8px 5px}
.ri{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;text-align:left;width:100%}
.ri:hover{background:var(--hover)} .ri.on{background:var(--sel)}
.ri .t{display:flex;align-items:baseline;gap:8px}
.ri .n{font-weight:600;font-size:.933rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri.unread .n{font-weight:700}
.ri .tm{font-size:.733rem;color:var(--ink3);margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.ri .p{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.867rem}
.ri.unread .p{color:var(--ink)}
.ri .row2{display:flex;align-items:center;gap:8px}
.badge{min-width:21px;height:21px;padding:0 5px;border-radius:13px;background:var(--ink3);color:var(--bg);font-size:.733rem;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.badge.hi{background:var(--accent);color:var(--accent-ink)}
.mut{color:var(--ink3);width:13px;height:13px}
.inv{margin:0 0 5px;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--raise);display:flex;flex-direction:column;gap:8px}
.inv .who{display:flex;gap:8px;align-items:center} .inv .iacts{display:flex;gap:8px}
.empty{color:var(--ink3);padding:21px 8px;text-align:center}

/* room */
.sub{font-size:.8rem;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.sub svg{width:13px;height:13px;color:var(--ok)}
#banner,#ubar{flex:none;flex-wrap:wrap;display:flex;gap:8px;align-items:center;padding:8px 21px;background:var(--hl);color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
#tl{flex:1;overflow:auto;padding:13px 0 8px;overflow-anchor:none;contain:content}
.day{display:flex;align-items:center;gap:13px;margin:13px 21px;color:var(--ink3);font-size:.733rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.day:before,.day:after{content:"";height:1px;background:var(--line);flex:1}
.newline{display:flex;align-items:center;gap:8px;margin:8px 21px;color:var(--accent);font-size:.733rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.newline:after{content:"";height:1px;background:var(--accent);flex:1;opacity:.5}
.sys{margin:5px 21px 5px 63px;color:var(--ink3);font-size:.8rem}
.sys button{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
.msg{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:8px;padding:2px 21px}
.msg.first{margin-top:8px}
.msg:hover,.msg.act{background:var(--panel)}
.msg.hl{background:var(--hl)}
.msg .gut{font-size:.667rem;color:var(--ink3);text-align:right;padding-top:4px;opacity:0;font-variant-numeric:tabular-nums}
.msg:hover .gut{opacity:1}
.msg .hd{display:flex;align-items:baseline;gap:8px}
.msg .nm{font-weight:650;font-size:.933rem}
.msg .ts{font-size:.733rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.body{font-size:var(--fs);line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.body.big{font-size:2.267rem;line-height:1.2}
.body code{font:.9em var(--mono);background:var(--hover);padding:1px 5px;border-radius:5px}
.body a{color:var(--accent);text-underline-offset:2px}
.pill{background:var(--sel);color:var(--accent);border-radius:5px;padding:0 4px;font-weight:600}
.pill.me{background:var(--accent);color:var(--accent-ink)}
.ed{font-size:.733rem;color:var(--ink3);margin-left:5px}
.quote{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ink2);margin:2px 0;padding:2px 8px;border-left:2px solid var(--ink3);max-width:100%;text-align:left}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 2px}
.rx button{height:24px;padding:0 8px;border-radius:13px;border:1px solid var(--line);background:var(--raise);font-size:.8rem;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.rx button.mine{border-color:var(--accent);background:var(--sel);color:var(--accent);font-weight:650}
.st{font-size:.733rem;color:var(--ink3);display:flex;align-items:center;gap:4px;margin-top:2px}
.st svg{width:13px;height:13px} .st.read svg{color:var(--accent)} .st.failed{color:var(--bad)}
.st button{text-decoration:underline;color:inherit}
.acts{position:absolute;right:21px;top:-13px;display:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:2px;z-index:2}
.msg:hover .acts,.msg.act .acts{display:flex}
.acts .icon{width:28px;height:28px} .acts svg{width:16px;height:16px}
.typing{height:21px;padding:0 21px 0 63px;color:var(--ink3);font-size:.8rem;flex:none}
.intro{margin:34px 21px 13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.intro h3{margin:0;font-size:1.4rem;letter-spacing:-.02em} .intro p{margin:0;color:var(--ink2);max-width:55ch}

/* composer */
#comp{flex:none;padding:0 21px 13px;position:relative}
.cbox{border:1px solid var(--line);border-radius:13px;background:var(--raise);transition:border-color .12s}
.cbox:focus-within{border-color:var(--accent)}
.ctx{display:flex;align-items:center;gap:8px;padding:8px 13px 0;font-size:.8rem;color:var(--ink2)}
.ctx b{color:var(--ink)} .ctx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:flex-end;gap:2px;padding:5px}
#ta{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;font-size:var(--fs);line-height:1.45;padding:7px 8px;max-height:210px}
#send{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#send:disabled{background:var(--hover);color:var(--ink3);cursor:default}
.hint{font-size:.733rem;color:var(--ink3);padding:5px 5px 0;display:flex;gap:13px}
@media (max-width:767px){.hint{display:none}}
.pop{position:absolute;left:21px;bottom:100%;margin-bottom:5px;width:min(340px,calc(100% - 42px));background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:5;max-height:233px;overflow:auto}
.pop .o{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;width:100%;text-align:left}
.pop .o.on,.pop .o:hover{background:var(--sel)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo button{height:34px;border-radius:5px;font-size:1.4rem} .emo button:hover{background:var(--hover)}
#picker{position:fixed;z-index:60;width:296px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px}

/* details panel */
.pbody{flex:1;overflow:auto;padding:21px 13px;display:flex;flex-direction:column;gap:21px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero h3{margin:0;font-size:1.133rem;letter-spacing:-.01em} .hero p{margin:0;color:var(--ink2)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp h4{margin:0 0 3px;font-size:.733rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.note{display:flex;gap:8px;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink2)}
.note svg{color:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{height:34px;font-weight:600;color:var(--ink2)} .seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
.mem{display:flex;gap:8px;align-items:center;padding:5px;border-radius:8px;width:100%;text-align:left}
.mem:hover{background:var(--hover)}
.img{display:block;margin:2px 0;position:relative} .img img,.img video{background:var(--panel);min-width:89px;min-height:55px;display:block;max-width:min(321px,100%);max-height:233px;border-radius:8px;border:1px solid var(--line)}
.snip{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} mark{background:var(--hl);color:inherit;border-radius:3px}
.dlg label{display:flex;flex-direction:column;gap:5px;color:var(--ink);font-weight:600}
.msg button.nm:hover{text-decoration:underline}
.mem .role{margin-left:auto;font-size:.733rem;color:var(--ink3)}

/* overlays: centred, light scrim, 550 wide, at most 61.8% tall */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:13px}
.dlg{width:min(550px,100%);max-height:61.8vh;background:var(--raise);border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.dlg header{padding:21px 21px 8px;display:flex;align-items:center;gap:8px}
.dlg header h3{margin:0;font-size:1.133rem;letter-spacing:-.01em;flex:1}
.dlg .c{padding:8px 21px 21px;overflow:auto;display:flex;flex-direction:column;gap:13px;color:var(--ink2)}
.dlg footer{padding:13px 21px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.dlg input[type=text]{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 13px;width:100%}
.tabs{display:flex;gap:2px;padding:0 21px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 13px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.set{display:flex;align-items:center;gap:13px;color:var(--ink)}
.set small{display:block;color:var(--ink3)} .set>div{flex:1}
.sw{width:34px;height:21px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .12s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--raise);transition:transform .12s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--accent)} .sw[aria-checked="true"]:after{transform:translateX(13px)}
.keys{display:grid;grid-template-columns:1fr auto;gap:8px 21px;color:var(--ink)}
.addr{font:.8rem var(--mono);overflow-wrap:anywhere;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.qs .o{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;width:100%;text-align:left;color:var(--ink)}
.qs .o.on,.qs .o:hover{background:var(--sel)}
#menu{position:fixed;z-index:50;min-width:233px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px}
#menu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px;border-radius:5px;text-align:left}
#menu button:hover{background:var(--hover)} #menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#toasts{position:fixed;right:13px;top:68px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(321px,calc(100% - 26px))}
.toast{display:flex;gap:8px;align-items:center;padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);text-align:left;width:100%}
.toast b{display:block} .toast span{color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#onb{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;padding:21px}
.onb{width:min(377px,100%);display:flex;flex-direction:column;gap:21px}
.onb h2{margin:0;font-size:2.267rem;letter-spacing:-.03em;line-height:1.1} .onb p{margin:0;color:var(--ink2);font-size:1rem}
.onb input{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--raise);padding:0 13px;font-size:1rem;width:100%}
.onb .btn{height:42px;font-size:1rem}
.steps{display:flex;gap:5px} .steps i{height:3px;flex:1;border-radius:2px;background:var(--line)} .steps i.on{background:var(--accent)}
.home{flex:1;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:21px}
.back{display:none} @media (max-width:767px){.back{display:grid}}

/* phase 1 additions */
#scrim{z-index:90} #menu,#picker{z-index:95} #toasts{z-index:96}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:21px}
.kitmsg{min-height:18px;font-size:.8rem;color:var(--ink3)} .kitmsg.ok{color:var(--ok)} .kitmsg.bad{color:var(--bad)}
.okmark{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--ok)} .okmark svg{width:34px;height:34px}
.tacts{display:flex!important;gap:8px;margin-top:8px}
.toast{cursor:default} .toast span span{white-space:normal}
.row{display:flex;align-items:center;gap:13px;color:var(--ink)} .row>div:first-child{flex:1;min-width:0} .row small{display:block;color:var(--ink3)}
.emo7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center} .emo7 b{display:block;font-size:1.867rem;font-weight:400} .emo7 span{font-size:.733rem;color:var(--ink2)}
@media (max-width:480px){.emo7{grid-template-columns:repeat(4,1fr)}}
.qr{width:144px;height:144px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);background:#fff;padding:8px;border-radius:8px} .qr i{background:#111} .qr i.o{background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px} .chip{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:13px;background:var(--sel);color:var(--accent);font-weight:600;font-size:.8rem}
.trust{width:13px;height:13px;color:var(--ok);margin-left:5px;flex:none}
.stamps .msg .gut{opacity:1}
.home .btn{margin:5px}
.meimg{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--panel)} .meimg.l{width:55px;height:55px}
.tabs{overflow-x:auto;scrollbar-width:none} .tabs button{white-space:nowrap}
:root[data-contrast="1"]{--ink2:var(--ink);--ink3:color-mix(in srgb,var(--ink) 78%,var(--bg));--line:color-mix(in srgb,var(--ink) 55%,var(--bg))}
.ri:focus-visible{outline-offset:-2px}

/* phase 1, batch two */
#room{position:relative}
#toEnd{position:absolute;right:21px;bottom:calc(100% + 34px);z-index:3;box-shadow:var(--shadow)}

  t.innerHTML = `<span class="grow"><b>${esc(title)}</b><span>${esc(text)}</span>${acts.length ? `<span class="tacts">${acts.map((a, i) => `<button class="btn small${i ? "" : " primary"}" data-i="${i}">${esc(a[0])}</button>`).join("")}</span>` : ""}</span>`;
  t.onclick = e => { const b = e.target.closest("[data-i]"); if (b) { t.remove(); acts[+b.dataset.i][1](); } };
  acts.length ? $("#toasts")[ms ? "append" : "prepend"](t) : $("#notes").append(t); if (ms) setTimeout(() => t.remove(), ms); return t;   // a notice that waits for an answer goes on top; one that only informs goes to its own corner
}
function stage(html) {   // every first-run screen shares this frame
  let o = $("#onb"); if (!o) { o = document.createElement("div"); o.id = "onb"; document.body.append(o); }
  o.innerHTML = `<div class="onb">${html}</div>`; o.onclick = o.onkeydown = o.oninput = null;
  const f = o.querySelector("input,button"); if (f) f.focus(); return o;
}
const unstage = () => { const o = $("#onb"); if (o) o.remove(); };

/* ---------- first run, restore, identity confirmed ---------- */
onboard = function (step = 0) {
  const dots = n => `<div class="steps">${[0, 1, 2].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;
  if (step === 0) { const o = stage(`<h2>Private messages, with no server.</h2><p>No account and no password. Your identity is a key that stays on this device.</p><button class="btn primary" data-o="create">Create my identity</button><button class="btn" data-o="restore">I have a recovery kit</button>`);
    o.onclick = e => { const b = e.target.closest("[data-o]"); if (b) b.dataset.o === "create" ? onboard(1) : restore(); }; }
  else if (step === 1) { const o = stage(`${dots(1)}<h2>What should people call you?</h2><p>You can change this later.</p><input id="nm" type="text" value="${esc(S.set.name)}" aria-label="Your name" maxlength="40"><button class="btn primary" data-o="go">Continue</button>`);
    const go = () => { const v = $("#nm").value.trim(); if (!v) return; S.set.name = v; U.me.n = v; applySet(); ID.created = true; saveId(); onboard(2); };
    o.onclick = e => { if (e.target.closest("[data-o]")) go(); }; o.onkeydown = e => { if (e.key === "Enter") go(); }; }
  else { const o = stage(`${dots(2)}<h2>Save a recovery kit.</h2><p>Why: this device holds the only copy of your key.</p><p>How: the kit is a short code you keep somewhere safe.</p><p>What it does: restores your identity on another device.</p><button class="btn primary" data-o="kit">Save a kit now</button><button class="btn" data-o="skip">Not now</button>`);
    o.onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; unstage(); drawAll(); if (b.dataset.o === "kit") createKit(); }; }
};
function restore() {
  const o = stage(`<h2>Restore your identity.</h2><p>Enter the recovery kit you saved: 32 letters and digits.</p><input id="kit" type="text" autocomplete="off" spellcheck="false" aria-label="Recovery kit" placeholder="XXXX-XXXX-XXXX-XXXX" style="font-family:var(--mono)"><div id="kitMsg" class="kitmsg" aria-live="polite"></div>
    <button class="btn primary" data-o="go" disabled>Restore</button><button class="btn" data-o="device">Confirm from another device</button><button class="btn" data-o="sample">Fill in a sample kit</button><button class="btn" data-o="back">Back</button>`);
  const upd = () => { const st = kitState($("#kit").value); $("#kitMsg").textContent = { empty: "", short: "Keep typing.", bad: "That is not a valid kit. Check for a mistyped character.", ok: "This kit is valid." }[st];
    $("#kitMsg").className = "kitmsg " + st; o.querySelector('[data-o="go"]').disabled = st !== "ok"; };
  o.oninput = upd;
  o.onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; const a = b.dataset.o;
    if (a === "back") onboard(0); else if (a === "sample") { $("#kit").value = newKit(); upd(); }
    else if (a === "device") verifyFlow({ kind: "restore", name: "your other device", onDone: confirmed });
    else if (a === "go" && !b.disabled) { ID.kit = true; confirmed(1); } };
}
function confirmed(kit) {
  ID.created = true; saveId();
  const o = stage(`<div class="okmark">${I.lock}</div><h2>Sample: nothing was restored.</h2><p>${kit === 1 ? "The kit's form was checked and is valid." : "No other device was asked."} No key was restored and nothing was decrypted.</p><button class="btn primary" data-o="go">Continue</button>`);
  o.onclick = e => { if (e.target.closest("[data-o]")) { unstage(); drawAll(); } };
}
function createKit() {
  const kit = newKit();
  dialog(`<header><h3>Your recovery kit</h3></header><div class="c"><p style="margin:0">Why: it is the only way back in if you lose this device.</p><div class="addr" style="font-size:1rem;text-align:center;letter-spacing:.04em;color:var(--ink)">${kit}</div>
    <div style="display:flex;gap:8px"><button class="btn" id="kc">Copy</button><button class="btn" id="kd">Save as a file</button></div><p style="margin:0">Keep it where only you can reach it. Anyone who holds it can become you.</p></div>
    <footer><button class="btn" data-close>Not now</button><button class="btn primary" id="kn">I have saved it</button></footer>`, sc => {
    $("#kc", sc).onclick = () => { if (navigator.clipboard) navigator.clipboard.writeText(kit).then(() => { $("#kc", sc).textContent = "Copied"; }).catch(() => {}); };
    $("#kd", sc).onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([kit + "\n"], { type: "text/plain" })); a.download = "holo-messenger-recovery-kit.txt"; a.click(); };
    $("#kn", sc).onclick = () => dialog(`<header><h3>Confirm your kit</h3></header><div class="c"><p style="margin:0">Type or paste the kit you saved, to check your copy is good.</p><input type="text" id="kv" autocomplete="off" spellcheck="false" aria-label="Recovery kit" style="font-family:var(--mono)" autofocus><div id="kvm" class="kitmsg" aria-live="polite"></div></div>
      <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="kok" disabled>Confirm</button></footer>`, s2 => {
      $("#kv", s2).oninput = () => { const v = kitNorm($("#kv", s2).value), ok = v === kitNorm(kit), full = v.length >= 32;
        $("#kvm", s2).textContent = !v ? "" : ok ? "It matches." : full ? "That does not match the kit shown." : "Keep typing."; $("#kvm", s2).className = "kitmsg " + (ok ? "ok" : full ? "bad" : "short"); $("#kok", s2).disabled = !ok; };
      $("#kok", s2).onclick = () => { ID.kit = true; saveId(); closeOverlay(); drawList(); toastMsg("Recovery kit saved", "You can restore your identity on another device."); };
    });

}
function signOut() {
  const wipe = () => confirmDlg("Remove everything from this device?", `<p style="margin:0">What happens: your identity, chats and settings are deleted from this browser.</p><p style="margin:0;color:var(--warn);font-weight:600">${ID.kit ? "You can restore your identity later with your recovery kit." : "You have no recovery kit. This identity cannot be recovered."}</p>`,
    "Remove and sign out", "danger", () => { try { Object.keys(localStorage).forEach(k => { if (k.startsWith("hm-")) localStorage.removeItem(k); }); } catch (e) {} location.reload(); });   // every key this page writes starts with hm-

}

/* ---------- one tab at a time (Session.lockStep) ---------- */
let lockCh = null, holdsLock = true, booting = true; setTimeout(() => { booting = false; }, 700);
function lockScreen(kind) {
  let l = $("#lock"); if (!kind) { if (l) l.remove(); return; }
  if (!l) { l = document.createElement("div"); l.id = "lock"; document.body.append(l); }
  l.innerHTML = `<div class="onb"><h2>${kind === "ask" ? "Holo Messenger is open in another tab." : "You moved to another tab."}</h2><p>${kind === "ask" ? "Only one tab uses your identity at a time, so nothing is sent twice." : "This tab is paused. Your chats continue in the other one."}</p><button class="btn primary" data-take>Use it here</button></div>`;
  l.querySelector("button").focus();
}
try { lockCh = new BroadcastChannel("hm-lock");
  lockCh.onmessage = ({ data }) => { if (data === "hello" && holdsLock) lockCh.postMessage("held");
    else if (data === "held" && booting && holdsLock) { holdsLock = false; lockScreen("ask"); }
    else if (data === "take" && holdsLock) { holdsLock = false; lockScreen("moved"); } };
  lockCh.postMessage("hello"); } catch (e) {}

/* ---------- verification: compare seven emoji, or scan a code ---------- */
const VEMO = [["🐶", "Dog"], ["🔑", "Key"], ["🌙", "Moon"], ["🎈", "Balloon"], ["⚓", "Anchor"], ["🍎", "Apple"], ["🚲", "Bicycle"], ["🎸", "Guitar"], ["📌", "Pin"], ["🌵", "Cactus"], ["🦋", "Butterfly"], ["☂️", "Umbrella"]];
function verifyFlow(v, step = v.incoming ? "emoji" : "start", reason = "") {
  const done = () => { if (v.kind === "device") { const d = ID.devices.find(x => x.id === v.id); if (d) d.verified = true; } else if (v.kind === "user" && !ID.verified.includes(v.id)) { ID.verified.push(v.id); const r = R(S.cur); if (r && r.members.includes(v.id)) say(r, "You verified " + first(v.id)); } saveId(); };
  const head = `<header><h3>Verify ${esc(v.name)}</h3><button class="icon" data-close aria-label="Close">${I.x}</button></header>`;
  const go = (s, r) => verifyFlow(v, s, r);
  if (step === "start") dialog(`${head}<div class="c"><p style="margin:0">Why: verifying proves you are talking to the right ${v.kind === "user" ? "person" : "device"}, not someone in between.</p><p style="margin:0">How: both sides compare the same seven pictures, or one scans a code from the other.</p></div>
    <footer><button class="btn" id="vq">Scan a code</button><button class="btn primary" id="ve" autofocus>Compare pictures</button></footer>`, sc => { $("#ve", sc).onclick = () => go("wait"); $("#vq", sc).onclick = () => go("qr"); });
  else if (step === "wait") { dialog(`${head}<div class="c"><p style="margin:0">Waiting for ${esc(v.name)} to accept. This is a sample: no other device was asked, and it moves on by itself.</p></div><footer><button class="btn" id="vc">Cancel</button></footer>`, sc => { $("#vc", sc).onclick = () => { clearTimeout(tm); go("cancel", "You cancelled."); }; });
    const tm = setTimeout(() => { if ($("#vc")) go("emoji"); }, 1200); }
  else if (step === "emoji") { const h = hue(v.name), pick = Array.from({ length: 7 }, (_, i) => VEMO[(h + i * 5) % VEMO.length]);
    dialog(`${head}<div class="c"><p style="margin:0">Do both sides show these seven pictures, in this order?</p><div class="emo7">${pick.map(([e, n]) => `<div><b>${e}</b><span>${n}</span></div>`).join("")}</div></div>
      <footer><button class="btn danger" id="vn">They do not match</button><button class="btn primary" id="vy" autofocus>They match</button></footer>`, sc => { $("#vy", sc).onclick = () => { done(); go("done"); }; $("#vn", sc).onclick = () => go("cancel", "The pictures did not match. Someone may be in between. Do not trust this until you have verified another way."); }); }
  else if (step === "qr") { const h = hue(v.name) + 17; let cells = ""; for (let i = 0; i < 144; i++) { const x = i % 12, y = (i / 12) | 0, corner = (x < 3 && y < 3) || (x > 8 && y < 3) || (x < 3 && y > 8); cells += `<i class="${corner || ((x * 7 + y * 13 + h * (x ^ y)) % 3) ? "" : "o"}"></i>`; }
    dialog(`${head}<div class="c"><div class="qr" role="img" aria-label="Sample code">${cells}</div><p style="margin:0;text-align:center">A sample code. On a real device, scan this with the other one.</p></div>
      <footer><button class="btn" id="vc">Cancel</button><button class="btn primary" id="vs" autofocus>The other side scanned it</button></footer>`, sc => { $("#vs", sc).onclick = () => { done(); go("done"); }; $("#vc", sc).onclick = () => go("cancel", "You cancelled. The other side is told too."); }); }
  else if (step === "done") dialog(`<header><h3>Verified</h3></header><div class="c" style="align-items:center;text-align:center"><div class="okmark">${I.lock}</div><p style="margin:0">${esc(v.name[0].toUpperCase() + v.name.slice(1))} is verified.</p></div><footer><button class="btn primary" id="vd" autofocus>Done</button></footer>`,
    sc => { $("#vd", sc).onclick = () => { closeOverlay(); if (v.onDone) v.onDone(); else { drawPanel(); if (S.cur) drawTimeline(); } }; });
  else dialog(`<header><h3>Verification cancelled</h3></header><div class="c"><p style="margin:0">${esc(reason)}</p></div><footer><button class="btn" data-close>Close</button><button class="btn primary" id="vr" autofocus>Try again</button></footer>`, sc => { $("#vr", sc).onclick = () => go("start"); });
}
const incomingVerify = () => toastMsg("Verification request", "Firefox on a laptop wants to verify with this device.", [["Accept", () => verifyFlow({ kind: "device", id: "d2", name: "Firefox on a laptop", incoming: true })], ["Decline", () => {}]], 0);

/* ---------- profile card: message, mention, verify, block ---------- */

  const r = R(S.cur), u = U[id], ver = id === "me" || ID.verified.includes(id), blocked = ID.blocked.includes(id), rl = r && role(r.power[id] || 0);
  const face = id === "me" && S.set.avatar ? `<img class="meimg l" src="${S.set.avatar}" alt="">` : av(u.n, "l");
  dialog(`<header><span class="grow"></span><button class="icon" data-close aria-label="Close">${I.x}</button></header><div class="c" style="align-items:center;text-align:center">
    <button data-avbig="${id}" aria-label="Show picture full size">${ver ? `<span class="ring">${face}</span>` : face}</button><div><div style="font-size:1.133rem;font-weight:650;color:var(--ink)">${esc(u.n)}${id === "me" ? " (you)" : ""}</div><div>${rl ? rl + " in " + esc(r.name) : ""}</div></div>
    <div class="note" style="text-align:left;align-self:stretch">${ver ? I.lock : I.info.replace("<svg", '<svg style="color:var(--ink3)"')}<span>${ver ? "Verified. You have confirmed this identity." : "Not verified yet. Compare pictures in person or on a call to verify."}</span></div>
    <div class="addr" style="align-self:stretch;text-align:left">${addrOf(u.n)}</div>${blocked ? '<p style="margin:0;color:var(--warn);font-weight:600">You have blocked this person. Their messages are hidden.</p>' : ""}</div>
    ${id === "me" ? `<footer><button class="btn primary" id="pe">Edit profile</button></footer>` : `<footer style="flex-wrap:wrap"><button class="btn danger" id="pb">${blocked ? "Unblock" : "Block"}</button>${ver ? "" : '<button class="btn" id="pv">Verify</button>'}${r && !r.dm ? '<button class="btn" id="pn">Mention</button>' : ""}<button class="btn primary" id="pm">Message</button></footer>`}`, sc => {
    const on = (q, f) => { const b = $(q, sc); if (b) b.onclick = f; };
    on("#pm", () => startDm(id)); on("#pe", () => settings("account")); on("#pv", () => verifyFlow({ kind: "user", id, name: first(id) }));
    on("#pn", () => { closeOverlay(); const ta = $("#ta"); if (ta) { ta.setRangeText("@" + first(id) + " ", ta.selectionStart, ta.selectionEnd, "end"); grow(); ta.focus(); } });
    on("#pb", () => { const i = ID.blocked.indexOf(id); i < 0 ? ID.blocked.push(id) : ID.blocked.splice(i, 1); BLOCKED.length = 0; BLOCKED.push(...ID.blocked); saveId(); closeOverlay(); S.rooms.forEach(x => { x.lo = null; }); if (S.cur) drawTimeline(true); drawList(); });
  });
};
const _startDm = startDm;
startDm = function (id) {   // a new chat is confirmed by name before it exists
  if (S.rooms.some(x => x.dm === id && !x.invite)) return _startDm(id);
  confirmDlg(`Start a chat with ${U[id].n}?`, `<p style="margin:0">What happens: an encrypted chat is created, and ${esc(first(id))} sees it when you send your first message.</p>`, "Start chat", "primary", () => _startDm(id));
};

/* ---------- invite people: pick several, see progress, see who could not be reached ---------- */
function invitePeople() {
  const r = R(S.cur), picked = new Set(), pool = Object.keys(U).filter(id => id !== "me" && !r.members.includes(id) && !(r.invited || []).includes(id));
  dialog(`<header><h3>Invite to ${esc(r.name)}</h3><button class="icon" data-close aria-label="Close">${I.x}</button></header><div class="c qs"><div class="chips" id="ic"></div><div id="il"></div></div><footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="ig" disabled>Invite</button></footer>`, sc => {
    const draw = () => { $("#ic", sc).innerHTML = [...picked].map(id => `<span class="chip">${esc(first(id))}</span>`).join("");
      $("#il", sc).innerHTML = pool.length ? pool.map(id => `<button class="o${picked.has(id) ? " on" : ""}" data-pickp="${id}" aria-pressed="${picked.has(id)}">${av(U[id].n)}<span class="grow">${esc(U[id].n)}</span>${picked.has(id) ? I.check : ""}</button>`).join("") : `<div class="empty">Everyone you know is already here.</div>`;
      $("#ig", sc).disabled = !picked.size; $("#ig", sc).textContent = picked.size > 1 ? `Invite ${picked.size} people` : "Invite"; };
    sc.addEventListener("click", e => { const b = e.target.closest("[data-pickp]"); if (b) { const id = b.dataset.pickp; picked.has(id) ? picked.delete(id) : picked.add(id); draw(); } });
    $("#ig", sc).onclick = () => sendInvites(r, [...picked]); draw();
  });
}
function sendInvites(r, ids, force) {
  let k = 0; const failed = [];
  dialog(`<header><h3>Inviting</h3></header><div class="c"><p style="margin:0" id="ip" aria-live="polite">0 of ${ids.length}</p></div>`);
  const step = () => { if (k < ids.length) { const id = ids[k++];
      if (id === "omar" && !force) failed.push(id); else { (r.invited = r.invited || []).push(id); r.ev.push({ id: "e" + (++seq), t: "s", from: "me", to: id, ts: Date.now(), kind: "invited" }); }
      const p = $("#ip"); if (p) p.textContent = `${k} of ${ids.length}`; setTimeout(step, 260); return; }
    if (failed.length) dialog(`<header><h3>${failed.length === ids.length ? "Nobody was invited" : "Some people were not invited"}</h3></header><div class="c">${failed.map(id => `<div class="mem">${av(U[id].n)}<span>${esc(U[id].n)}</span><span class="role">sample failure</span></div>`).join("")}<p style="margin:0">A sample failure, shown so you can see what a failed invite looks like. Nobody was asked.</p></div>
      <footer><button class="btn" data-close>Close</button><button class="btn primary" id="ia" autofocus>Invite anyway</button></footer>`, sc => { $("#ia", sc).onclick = () => sendInvites(r, failed, true); });   // Invite.inviteOutcome
    else closeOverlay();
    drawTimeline(true); drawList(); drawPanel(); };
  setTimeout(step, 260);
}

document.addEventListener("click", e => {   // before the base handlers: the attach menu and delete take over

    dialog(`<header><h3>Open this link?</h3></header><div class="c"><p style="margin:0">Why this asks: the text shown is not the address it goes to.</p><p style="margin:0">It says: <b style="color:var(--ink)">${esc(b.textContent)}</b></p><div class="addr">${esc(url)}</div><p style="margin:0">It goes to <b style="color:var(--ink)">${esc(host)}</b>.</p></div>
      <footer><button class="btn" data-close autofocus>Cancel</button><a class="btn primary" style="display:grid;place-items:center;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-close>Open</a></footer>`); }
  else if ((b = q(".inv .who"))) { const acc = b.parentElement.querySelector("[data-accept]"); if (acc) openRoom(acc.dataset.accept); }
});
document.addEventListener("contextmenu", e => { const el = e.target.closest(".msg[data-id]"); if (!el || e.target.closest("a,input,textarea")) return; e.preventDefault(); msgMenu(el, e.clientX, e.clientY); });
document.addEventListener("keydown", e => { if ((isMac ? e.metaKey : e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "l" && !$("#scrim") && e.target.id !== "ta") { e.preventDefault(); noList(); } });

/* ---------- drag a message sideways to reply (Timeline.startsReply: 64 px) ---------- */
let sw = null;
document.addEventListener("touchstart", e => { const el = e.target.closest(".msg[data-id]"); sw = el && e.touches.length === 1 ? { el, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0 } : null; }, { passive: true });
document.addEventListener("touchmove", e => { if (!sw) return; const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y; if (Math.abs(dy) > 34) { sw.el.style.transform = ""; sw = null; return; } sw.dx = Math.max(0, Math.min(89, dx)); sw.el.style.transform = sw.dx ? `translateX(${sw.dx}px)` : ""; }, { passive: true });
document.addEventListener("touchend", () => { if (!sw) return; sw.el.style.transform = ""; if (sw.dx >= 64) { const b = sw.el.querySelector('[data-act="reply"]'); if (b) b.click(); } sw = null; });

S.epoch++; saveDraft(); drawRoom(); drawList();
</script>
<script>
"use strict";
/* ===== Phase 1 screens, batch three: people and rooms by ID, link or code; creating and running a room; the fuller details panel;
   invitations and their states; warnings before unsaved changes are lost; reminders. Sample data: nothing is sent, and no camera is used. ===== */
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pinIcon = '<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg>';
const CLOSE = `<button class="icon" data-close aria-label="Close">${I.x}</button>`, P0 = '<p style="margin:0">';
const ACCESS = { invite: ["Invite only", "Only people who are invited can join"], ask: ["Ask to join", "Anyone with the link can ask, and a moderator lets them in"], link: ["Anyone", "Anyone who has the link can join"] };
const accessOf = r => r.access || (r.priv ? "invite" : "link");
const linkTo = tag => location.href.split("#")[0] + "#" + tag;
const shortId = a => a.slice(0, 11) + "…" + a.slice(-4);
const idOf = a => Object.keys(U).find(k => (U[k].addr || addrOf(U[k].n)) === a);
const personFor = a => { let id = idOf(a); if (!id) { id = "x" + (++seq); U[id] = { n: shortId(a), addr: a }; } return id; };   // a person known only by ID shows by that ID
const say = (r, text) => r.ev.push({ id: "e" + (++seq), t: "s", from: "me", ts: Date.now(), kind: "note", text });
const canPin = r => !!r && !r.invite && (!!r.dm || myPower(r) >= 50);
const pinsOf = r => (r.pins || []).map(id => r.ev.find(e => e.id === id && !e.del)).filter(Boolean);
const copyText = (t, title, text) => { const no = () => toastMsg("Could not copy", "Select the text and copy it by hand.", [], 4000); navigator.clipboard ? navigator.clipboard.writeText(t).then(() => toastMsg(title, text, [], 3000)).catch(no) : no(); };
const qrCells = h => { let c = ""; for (let i = 0; i < 144; i++) { const x = i % 12, y = (i / 12) | 0, corner = (x < 3 && y < 3) || (x > 8 && y < 3) || (x < 3 && y > 8); c += `<i class="${corner || ((x * 7 + y * 13 + h * (x ^ y)) % 3) ? "" : "o"}"></i>`; } return c; };
const setBlocked = (id, on) => { const i = ID.blocked.indexOf(id); if (on === i >= 0) return; on ? ID.blocked.push(id) : ID.blocked.splice(i, 1); BLOCKED.length = 0; BLOCKED.push(...ID.blocked); saveId(); S.rooms.forEach(x => { x.lo = null; }); if (S.cur) drawTimeline(true); drawList(); };
const hidePanel = () => { if (S.panel && panes(innerWidth) < 3) { S.panel = false; drawPanel(); const pb = $("#room [data-panel]"); if (pb) pb.setAttribute("aria-pressed", "false"); } };
const gotoMsg = id => { closeOverlay(); hidePanel(); jump(id); };
const makeRoom = x => { const r = Object.assign({ id: "r" + (++seq), members: ["me"], power: { me: 100 }, level: "default", priv: true, topic: "", lastRead: Date.now(), ev: [{ id: "e" + (++seq), t: "s", from: "me", ts: Date.now(), kind: "created" }, { id: "e" + (++seq), t: "s", from: "me", ts: Date.now(), kind: "note", text: "Encryption is on" }] }, x); S.rooms.push(r); closeOverlay(); openRoom(r.id); return r; };

/* ---------- a person or room from an ID, a link or a code. A picture code cannot be scanned here, so its text is pasted or typed ---------- */
const XR = { garden: { name: "Community garden", by: "sofia", members: ["sofia", "lena", "omar"], topic: "Who waters what, and when.", text: "Tomatoes need water on Friday." },
  gone: { name: "Old project", by: "dev", members: ["dev"], gone: true }, banned: { name: "Night owls", by: "omar", members: ["omar", "tomas"], bannedMe: true } };
function addInvite(c) { let r = S.rooms.find(x => x.code === c);
  if (!r) { const x = XR[c]; r = { id: "r" + (++seq), code: c, name: x.name, members: [...x.members], power: { [x.by]: 100 }, level: "all", invite: x.by, priv: true, topic: x.topic || "", lastRead: 0, gone: x.gone, bannedMe: x.bannedMe, ev: [s(x.by, 3 * D, "created"), m(x.by, 2 * H, x.text || "Welcome.")] }; S.rooms.push(r); drawList(); }
  return r; }
function resolveCode(text) { const t = text.trim(); let mm = t.match(/blake3:[0-9a-f]{64}/i);
  if (mm) { const a = mm[0].toLowerCase(), id = idOf(a); return id === "me" ? { err: "That is your own ID." } : id ? { user: id } : { addr: a }; }
  if ((mm = t.match(/(?:holo-room:|#j-)([a-z0-9]+)/i))) { const c = mm[1].toLowerCase(), r = R(c) || S.rooms.find(x => x.code === c); return r ? { [r.invite ? "invite" : "open"]: r.id } : XR[c] ? { room: c } : { err: "No room matches that code." }; }
  return { err: t ? "That is not an ID, a link or a room code. An ID starts with blake3: and has 64 more characters." : "" }; }
const personRow = (id, hint = "") => `<div class="pr"><button class="o" data-dm="${id}">${av(U[id].n)}<span class="grow">${esc(U[id].n)}</span><span style="color:var(--ink3)">${hint}</span></button><button class="icon" data-user="${id}" aria-label="Profile of ${esc(U[id].n)}" title="Profile">${I.info}</button></div>`;
const codeRow = x => { const r = x.room ? XR[x.room] : R(x.invite || x.open);
  return x.user ? personRow(x.user, "Start chat") : x.addr ? `<button class="o" data-code>${av("?")}<span class="grow" style="min-width:0;overflow-wrap:anywhere">${shortId(x.addr)}<small>Not someone you know yet</small></span></button>`
    : r ? `<button class="o" data-code>${av(r.name, "sq")}<span class="grow">${esc(r.name)}<small>${x.open ? "You are in this room" : "Invitation from " + esc(first(r.by || r.invite))}</small></span></button>` : x.err ? `<div class="empty">${esc(x.err)}</div>` : ""; };
function useCode(x) {
  if (x.user) profile(x.user);
  else if (x.addr) confirmDlg("Start a chat with this ID?", `<div class="addr">${x.addr}</div>${P0}Why this asks: nobody you know has this ID, and this page cannot check that it exists.</p>${P0}What happens: a chat is created. The person shows by their ID until you learn their name.</p>`, "Start chat", "primary", () => _startDm(personFor(x.addr)));
  else if (x.room || x.invite) previewRoom(x.invite || addInvite(x.room).id);
  else if (x.open) { closeOverlay(); openRoom(x.open); }
  else if (x.err) confirmDlg("That did not work", `${P0}${esc(x.err)}</p>`, "OK", "primary", () => {});
}
function openHash() {   // a link to a person opens the same card as inside a room; a link to a room opens it or its invitation
  const h = decodeURIComponent(location.hash.slice(1)); if (!/^[ujm]-/.test(h) || $("#onb") || $("#lock")) return;
  try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
  if (h[0] === "m") { const id = h.slice(2), r = S.rooms.find(x => !x.invite && x.ev.some(e => e.id === id && !e.del));   // a link to a message opens its chat at that message
    if (r) { closeOverlay(); openRoom(r.id); jump(id); } else confirmDlg("That did not work", `${P0}That message is not on this device.</p>`, "OK", "primary", () => {}); return; }
  useCode(resolveCode(h[0] === "u" ? h.slice(2) : "#" + h));
}
function shareDlg(title, link, what) {
  dialog(`<header><h3>${esc(title)}</h3>${CLOSE}</header><div class="c">${P0}${what}</p><div class="addr">${esc(link)}</div><div class="qr" role="img" aria-label="Sample picture code">${qrCells(hue(link))}</div>
    <p style="margin:0;text-align:center">A sample picture, not a working code. Share the link instead. It opens on this page only: sample data is not sent anywhere.</p></div>
    <footer><button class="btn" data-close>Close</button><button class="btn primary" id="shc" autofocus>Copy link</button></footer>`, sc => { $("#shc", sc).onclick = () => copyText(link, "Link copied", "Paste it where the other person can open it."); });
}
const shareRoom = r => shareDlg("Share " + r.name, linkTo("j-" + r.id), ACCESS[accessOf(r)][1] + ". The link shows people the room.");
function addByCode() {
  let x = {};
  dialog(`<header><h3>Add by code</h3>${CLOSE}</header><div class="c qs">${P0}Paste or type a person's ID, a link, or a room code.</p><input type="text" id="cd" placeholder="blake3:… or a link" aria-label="ID, link or code" autocomplete="off" spellcheck="false" autofocus><div id="cdr" aria-live="polite"></div>
    <div class="note">${I.info.replace("<svg", '<svg style="color:var(--ink3)"')}<span>The picture codes here are samples, and this page has no code reader yet. Paste or type what the code stands for instead.</span></div>
    <div class="sect" style="padding:0">Samples to try</div><div class="quick" style="justify-content:flex-start">${[["A person", addrOf(U.tomas.n)], ["A new ID", "blake3:" + "5a".repeat(32)], ["A room", "holo-room:garden"], ["A room that is gone", "holo-room:gone"], ["A room that banned you", "holo-room:banned"]].map(([t, c]) => `<button class="btn small" data-fill="${c}">${t}</button>`).join("")}</div></div>`, sc => {
    const draw = () => { x = resolveCode($("#cd", sc).value); $("#cdr", sc).innerHTML = codeRow(x); };
    $("#cd", sc).oninput = draw; $("#cd", sc).onkeydown = e => { if (e.key === "Enter" && (x.addr || x.room || x.invite || x.open)) useCode(x); };
    sc.addEventListener("click", e => { const b = e.target.closest("[data-fill]"); if (b) { $("#cd", sc).value = b.dataset.fill; draw(); const f = $("#cdr button", sc); if (f) f.focus(); } else if (e.target.closest("[data-code]")) useCode(x); });
  });
}

/* ---------- one picker for a group chat and for invitations: type a name, paste one or many IDs, or pick from the list ---------- */
function pickPeople(o) {
  const picked = new Set(), unk = new Set(), re = /blake3:[0-9a-f]{64}/gi, min = o.min || 1;
  dialog(`<header><h3>${esc(o.title)}</h3>${CLOSE}</header><div class="c qs"><div class="chips" id="ic"></div>
    <input type="text" id="iq" placeholder="A name, or paste one or more IDs" aria-label="Find people by name, or paste IDs" autocomplete="off" spellcheck="false" autofocus><div id="im" class="kitmsg" aria-live="polite"></div><div id="il"></div></div>
    <footer>${o.link ? '<button class="btn" id="ix" style="margin-right:auto">Invite by link</button>' : ""}<button class="btn" data-close>Cancel</button><button class="btn primary" id="ig" disabled></button></footer>`, sc => {
    const iq = $("#iq", sc), n = () => picked.size + unk.size;
    const draw = () => { const q = iq.value.trim().toLowerCase(), ids = o.pool.filter(id => U[id].n.toLowerCase().includes(q));
      $("#ic", sc).innerHTML = [...picked].map(id => `<button class="chip" data-unpick="${id}" aria-label="Remove ${esc(U[id].n)}">${esc(first(id))} ×</button>`).join("") + [...unk].map(a => `<button class="chip warn" data-unpick="${a}" aria-label="Remove the ID ${shortId(a)}">${shortId(a)} ×</button>`).join("");
      $("#il", sc).innerHTML = ids.length ? ids.map(id => `<button class="o${picked.has(id) ? " on" : ""}" data-pickp="${id}" aria-pressed="${picked.has(id)}">${av(U[id].n)}<span class="grow">${esc(U[id].n)}</span>${picked.has(id) ? I.check : ""}</button>`).join("") : `<div class="empty">${o.pool.length ? "Nobody matches. To add someone new, paste their ID." : esc(o.empty)}</div>`;
      $("#ig", sc).disabled = n() < min; $("#ig", sc).textContent = o.verb(n()); };
    iq.oninput = () => { const found = iq.value.match(re);
      if (found) { let add = 0, skip = 0; for (const f of found) { const a = f.toLowerCase(), id = idOf(a); if (id && o.pool.includes(id)) { picked.add(id); add++; } else if (id) skip++; else { unk.add(a); add++; } }
        iq.value = iq.value.replace(re, "").replace(/[\s,;]+/g, " ").trim(); $("#im", sc).textContent = `${add} added${skip ? `, ${skip} left out: ${o.skip}` : ""}.${unk.size ? " The IDs in yellow are not people you know." : ""}`; }
      draw(); };
    iq.onkeydown = e => { const f = $("#il [data-pickp]", sc); if (e.key === "Enter" && f && iq.value.trim()) { f.click(); iq.value = ""; draw(); iq.focus(); } };
    sc.addEventListener("click", e => { let b = e.target.closest("[data-pickp]");
      if (b) { const id = b.dataset.pickp; picked.has(id) ? picked.delete(id) : picked.add(id); draw(); const nb = $(`[data-pickp="${id}"]`, sc); if (nb) nb.focus(); }
      else if ((b = e.target.closest("[data-unpick]"))) { picked.delete(b.dataset.unpick); unk.delete(b.dataset.unpick); draw(); iq.focus(); } });
    if (o.link) $("#ix", sc).onclick = o.link;
    $("#ig", sc).onclick = () => { const ids = [...picked], many = unk.size > 1;
      const go = keep => { if (keep) unk.forEach(a => ids.push(personFor(a))); if (ids.length < min) { closeOverlay(); toastMsg("Nobody was added", "No people were left once the unknown IDs were dropped.", [], 4000); } else o.done(ids); };
      if (!unk.size) return go();
      dialog(`<header><h3>${unk.size} ID${many ? "s were" : " was"} not found</h3></header><div class="c">${P0}Why this asks: nobody you know has ${many ? "these IDs" : "this ID"}, and this page cannot check that ${many ? "they exist" : "it exists"}.</p>${[...unk].map(a => `<div class="addr">${a}</div>`).join("")}
        ${P0}What happens: keep ${many ? "them and they are" : "it and it is"} added by ID. Drop ${many ? "them" : "it"} and only the people found are added.</p></div><footer><button class="btn" id="ud">Drop</button><button class="btn primary" id="uk" autofocus>Keep</button></footer>`, s2 => { $("#uk", s2).onclick = () => go(true); $("#ud", s2).onclick = () => go(false); }); };
    draw();
  });
}
invitePeople = function () { const r = R(S.cur);
  pickPeople({ title: "Invite to " + r.name, pool: Object.keys(U).filter(id => id !== "me" && ![...r.members, ...(r.invited || []), ...(r.banned || [])].includes(id)), verb: n => n > 1 ? `Invite ${n} people` : "Invite",
    empty: "Everyone you know is already here.", skip: "already here, invited or banned", link: () => shareRoom(r), done: ids => sendInvites(r, ids) }); };
const groupChat = () => pickPeople({ title: "New group chat", pool: Object.keys(U).filter(id => id !== "me"), verb: n => n > 1 ? `Start a chat with ${n} people` : "Start chat", empty: "You know nobody yet. Paste an ID to add someone.", skip: "that is you",
  done: ids => ids.length === 1 ? startDm(ids[0]) : makeRoom({ group: true, name: ids.map(first).join(", ").slice(0, 60), members: ["me", ...ids], power: Object.fromEntries(["me", ...ids].map(id => [id, 100])) }) });

/* ---------- start a chat: a person by name, ID or link; a group; a room; a code ---------- */
newChat = function () {
  let x = null;
  dialog(`<header><h3>New chat</h3>${CLOSE}</header><div class="c qs"><input type="text" id="np" placeholder="A name, or paste an ID or link" aria-label="Find a person by name, ID or link" autocomplete="off" spellcheck="false" autofocus><div id="npr"></div>
    <div class="sect" style="padding:0">Or</div><div class="quick" style="justify-content:flex-start"><button class="btn" data-nc="group">New group chat</button><button class="btn" data-nc="room">Create a room</button><button class="btn" data-nc="code">Add by code</button><button class="btn" data-nc="mine">Show my code</button></div></div>`, sc => {
    const draw = () => { const v = $("#np", sc).value.trim(), q = v.toLowerCase(); x = /blake3:|#[uj]-|holo-room:/i.test(v) ? resolveCode(v) : null;
      const ids = Object.keys(U).filter(id => id !== "me" && U[id].n.toLowerCase().includes(q)).slice(0, 5);
      $("#npr", sc).innerHTML = x ? codeRow(x) : ids.length ? ids.map(id => personRow(id)).join("") : `<div class="empty">Nobody matches. Paste an ID or a link to add someone new.</div>`; };
    $("#np", sc).oninput = draw; draw(); $("#np", sc).onkeydown = e => { const f = $("#npr button", sc); if (e.key === "Enter" && f && $("#np", sc).value.trim()) f.click(); };
    sc.addEventListener("click", e => { if (e.target.closest("[data-code]")) useCode(x); });
  });
};
function createRoom() {
  let pic = null, acc = "invite";
  dialog(`<header><h3>Create a room</h3>${CLOSE}</header><div class="c"><div class="row"><div style="flex:none" id="cp"></div><div><button class="btn small" id="cpb">Choose a picture</button><small>Optional. An image up to 300 KB.</small></div></div>
    <label>Name<input type="text" id="cn" maxlength="60" data-was="" autocomplete="off" autofocus></label><div id="cm" class="kitmsg bad" aria-live="polite"></div>
    <label>Topic<input type="text" id="ct" maxlength="140" data-was="" placeholder="Optional. What the room is for." autocomplete="off"></label>
    <div class="grp"><h4>Who can join</h4><div class="seg" id="ca"></div><div id="cah"></div></div>
    <div class="note">${I.lock}<span>Always encrypted. Only the people in the room can read it.</span></div></div>
    <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="cc">Create room</button></footer>`, sc => {
