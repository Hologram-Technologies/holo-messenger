<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Holo Messenger: private messages with no server.">
<meta name="color-scheme" content="light dark">
<title>Holo Messenger</title>
<style>
/* Layout: three panes on one screen. Chat list, timeline, details. One pane under 768px, details dock at 1200px.
   Every measure is from the series 5, 8, 13, 21, 34, 55. */
:root{
  --bg:#FFFFFF; --panel:#F5F6F8; --raise:#FFFFFF; --ink:#11151C; --ink2:#4A5362; --ink3:#7A8494;
  --line:#E4E7EC; --hover:#ECEEF2; --sel:#E4E9FA; --accent:#3046D8; --accent-ink:#FFFFFF;
  --ok:#12805C; --warn:#A8610A; --bad:#C62F3B; --hl:#FBF1CC; --scrim:rgba(17,21,28,.28);
  --shadow:0 13px 34px rgba(17,21,28,.14),0 1px 3px rgba(17,21,28,.08);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --fs:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 13px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1116; --panel:#141820; --raise:#1A1F29; --ink:#EDEFF3; --ink2:#A9B1BE; --ink3:#7C8696;
  --line:#252B36; --hover:#1C222C; --sel:#1F2A4D; --accent:#8196FF; --accent-ink:#0B1020;
  --ok:#4CC38A; --warn:#F0B45A; --bad:#F2777F; --hl:#3A3212; --scrim:rgba(0,0,0,.5);
  --shadow:0 13px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{height:100%;display:grid;grid-template-columns:321px minmax(0,1fr)}
#app.panel-docked{grid-template-columns:321px minmax(0,1fr) 340px}
#list,#room,#panel{min-width:0;min-height:0;display:flex;flex-direction:column}
#list{background:var(--panel);border-right:1px solid var(--line)}
#panel{background:var(--panel);border-left:1px solid var(--line)}
#app:not(.panel-docked) #panel{position:fixed;inset:0 0 0 auto;width:min(340px,100%);z-index:30;box-shadow:var(--shadow)}
@media (max-width:767px){
  #app,#app.panel-docked{grid-template-columns:minmax(0,1fr)}
  #app.in-room #list{display:none} #app:not(.in-room) #room{display:none}
  #list{border-right:0}
  #app:not(.panel-docked) #panel{width:100%}
  .search .kbd{display:none} .search input{padding-right:13px}
  .acts{top:auto;bottom:100%;right:13px}
  .msg{padding:2px 13px} .day,.newline{margin-left:13px;margin-right:13px} .sys{margin-left:55px} #comp{padding:0 13px 13px} .typing{padding-left:55px}
  #app .icon{width:42px;height:42px} #comp #send{width:42px;height:42px} #app .acts .icon{width:34px;height:34px}
}
.bar{height:55px;flex:none;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line)}
.bar h1,.bar h2{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.icon:hover{background:var(--hover);color:var(--ink)}
.icon[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
.btn{height:34px;padding:0 13px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--raise)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{height:26px;padding:0 8px;font-size:12px}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:13px;flex:none;letter-spacing:0}
.av.sq{border-radius:8px}
.av.s{width:21px;height:21px;font-size:10px} .av.l{width:55px;height:55px;font-size:21px}
.av.me{box-shadow:0 0 0 2px var(--panel),0 0 0 4px transparent;background-clip:padding-box;position:relative}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#5B7CFA,#22C3C9,#8BD36B,#F4C65B,#F2788F,#9B7BFF,#5B7CFA);display:grid}
.ring .av{box-shadow:0 0 0 2px var(--panel)}

/* chat list */
.search{margin:13px;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raise);padding:0 55px 0 34px}
.search svg{position:absolute;left:8px;top:8px;color:var(--ink3)}
.kbd{font:11px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel)}
.search .kbd{position:absolute;right:8px;top:8px}
#rooms{contain:content;flex:1;overflow:auto;padding:0 8px 13px;display:flex;flex-direction:column;gap:1px}
.sect{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:13px 8px 5px}
.ri{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;text-align:left;width:100%}
.ri:hover{background:var(--hover)} .ri.on{background:var(--sel)}
.ri .t{display:flex;align-items:baseline;gap:8px}
.ri .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri.unread .n{font-weight:700}
.ri .tm{font-size:11px;color:var(--ink3);margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.ri .p{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ri.unread .p{color:var(--ink)}
.ri .row2{display:flex;align-items:center;gap:8px}
.badge{min-width:21px;height:21px;padding:0 5px;border-radius:13px;background:var(--ink3);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.badge.hi{background:var(--accent);color:var(--accent-ink)}
.mut{color:var(--ink3);width:13px;height:13px}
.inv{margin:0 0 5px;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--raise);display:flex;flex-direction:column;gap:8px}
.inv .who{display:flex;gap:8px;align-items:center} .inv .iacts{display:flex;gap:8px}
.empty{color:var(--ink3);padding:21px 8px;text-align:center}

/* room */
.sub{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.sub svg{width:13px;height:13px;color:var(--ok)}
#banner{flex:none;display:flex;gap:8px;align-items:center;padding:8px 21px;background:var(--hl);color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
#tl{flex:1;overflow:auto;padding:13px 0 8px;overflow-anchor:none;contain:content}
.day{display:flex;align-items:center;gap:13px;margin:13px 21px;color:var(--ink3);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.day:before,.day:after{content:"";height:1px;background:var(--line);flex:1}
.newline{display:flex;align-items:center;gap:8px;margin:8px 21px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.newline:after{content:"";height:1px;background:var(--accent);flex:1;opacity:.5}
.sys{margin:5px 21px 5px 63px;color:var(--ink3);font-size:12px}
.sys button{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
.msg{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:8px;padding:2px 21px}
.msg.first{margin-top:8px}
.msg:hover,.msg.act{background:var(--panel)}
.msg.hl{background:var(--hl)}
.msg .gut{font-size:10px;color:var(--ink3);text-align:right;padding-top:4px;opacity:0;font-variant-numeric:tabular-nums}
.msg:hover .gut{opacity:1}
.msg .hd{display:flex;align-items:baseline;gap:8px}
.msg .nm{font-weight:650;font-size:14px}
.msg .ts{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.body{font-size:var(--fs);line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.body.big{font-size:34px;line-height:1.2}
.body code{font:.9em var(--mono);background:var(--hover);padding:1px 5px;border-radius:5px}
.body a{color:var(--accent);text-underline-offset:2px}
.pill{background:var(--sel);color:var(--accent);border-radius:5px;padding:0 4px;font-weight:600}
.pill.me{background:var(--accent);color:var(--accent-ink)}
.ed{font-size:11px;color:var(--ink3);margin-left:5px}
.quote{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);margin:2px 0;padding:2px 8px;border-left:2px solid var(--ink3);max-width:100%;text-align:left}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 2px}
.rx button{height:24px;padding:0 8px;border-radius:13px;border:1px solid var(--line);background:var(--raise);font-size:12px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.rx button.mine{border-color:var(--accent);background:var(--sel);color:var(--accent);font-weight:650}
.st{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:4px;margin-top:2px}
.st svg{width:13px;height:13px} .st.read svg{color:var(--accent)} .st.failed{color:var(--bad)}
.st button{text-decoration:underline;color:inherit}
.acts{position:absolute;right:21px;top:-13px;display:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:2px;z-index:2}
.msg:hover .acts,.msg.act .acts{display:flex}
.acts .icon{width:28px;height:28px} .acts svg{width:16px;height:16px}
.typing{height:21px;padding:0 21px 0 63px;color:var(--ink3);font-size:12px;flex:none}
.intro{margin:34px 21px 13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.intro h3{margin:0;font-size:21px;letter-spacing:-.02em} .intro p{margin:0;color:var(--ink2);max-width:55ch}

/* composer */
#comp{flex:none;padding:0 21px 13px;position:relative}
.cbox{border:1px solid var(--line);border-radius:13px;background:var(--raise);transition:border-color .12s}
.cbox:focus-within{border-color:var(--accent)}
.ctx{display:flex;align-items:center;gap:8px;padding:8px 13px 0;font-size:12px;color:var(--ink2)}
.ctx b{color:var(--ink)} .ctx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:flex-end;gap:2px;padding:5px}
#ta{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;font-size:var(--fs);line-height:1.45;padding:7px 8px;max-height:210px}
#send{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#send:disabled{background:var(--hover);color:var(--ink3);cursor:default}
.hint{font-size:11px;color:var(--ink3);padding:5px 5px 0;display:flex;gap:13px}
@media (max-width:767px){.hint{display:none}}
.pop{position:absolute;left:21px;bottom:100%;margin-bottom:5px;width:min(340px,calc(100% - 42px));background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:5;max-height:233px;overflow:auto}
.pop .o{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;width:100%;text-align:left}
.pop .o.on,.pop .o:hover{background:var(--sel)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo button{height:34px;border-radius:5px;font-size:21px} .emo button:hover{background:var(--hover)}
#picker{position:fixed;z-index:60;width:296px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px}

/* details panel */
.pbody{flex:1;overflow:auto;padding:21px 13px;display:flex;flex-direction:column;gap:21px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero h3{margin:0;font-size:17px;letter-spacing:-.01em} .hero p{margin:0;color:var(--ink2)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp h4{margin:0 0 3px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.note{display:flex;gap:8px;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink2)}
.note svg{color:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{height:34px;font-weight:600;color:var(--ink2)} .seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--accent)}
.mem{display:flex;gap:8px;align-items:center;padding:5px;border-radius:8px;width:100%;text-align:left}
.mem:hover{background:var(--hover)}
.img{display:block;margin:2px 0} .img img{display:block;max-width:min(321px,100%);max-height:233px;border-radius:8px;border:1px solid var(--line)}
.snip{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} mark{background:var(--hl);color:inherit;border-radius:3px}
.dlg label{display:flex;flex-direction:column;gap:5px;color:var(--ink);font-weight:600}
.msg button.nm:hover{text-decoration:underline}
.mem .role{margin-left:auto;font-size:11px;color:var(--ink3)}

/* overlays: centred, light scrim, 550 wide, at most 61.8% tall */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:13px}
.dlg{width:min(550px,100%);max-height:61.8vh;background:var(--raise);border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.dlg header{padding:21px 21px 8px;display:flex;align-items:center;gap:8px}
.dlg header h3{margin:0;font-size:17px;letter-spacing:-.01em;flex:1}
.dlg .c{padding:8px 21px 21px;overflow:auto;display:flex;flex-direction:column;gap:13px;color:var(--ink2)}
.dlg footer{padding:13px 21px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.dlg input[type=text]{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 13px;width:100%}
.tabs{display:flex;gap:2px;padding:0 21px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 13px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.set{display:flex;align-items:center;gap:13px;color:var(--ink)}
.set small{display:block;color:var(--ink3)} .set>div{flex:1}
.sw{width:34px;height:21px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .12s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--raise);transition:transform .12s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--accent)} .sw[aria-checked="true"]:after{transform:translateX(13px)}
.keys{display:grid;grid-template-columns:1fr auto;gap:8px 21px;color:var(--ink)}
.addr{font:12px var(--mono);overflow-wrap:anywhere;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.qs .o{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;width:100%;text-align:left;color:var(--ink)}
.qs .o.on,.qs .o:hover{background:var(--sel)}
#menu{position:fixed;z-index:50;min-width:233px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px}
#menu button{display:flex;gap:8px;align-items:center;width:100%;padding:8px;border-radius:5px;text-align:left}
#menu button:hover{background:var(--hover)} #menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#toasts{position:fixed;right:13px;top:13px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(321px,calc(100% - 26px))}
.toast{display:flex;gap:8px;align-items:center;padding:13px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);text-align:left;width:100%}
.toast b{display:block} .toast span{color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#onb{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;padding:21px}
.onb{width:min(377px,100%);display:flex;flex-direction:column;gap:21px}
.onb h2{margin:0;font-size:34px;letter-spacing:-.03em;line-height:1.1} .onb p{margin:0;color:var(--ink2);font-size:15px}
.onb input{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--raise);padding:0 13px;font-size:15px;width:100%}
.onb .btn{height:42px;font-size:15px}
.steps{display:flex;gap:5px} .steps i{height:3px;flex:1;border-radius:2px;background:var(--line)} .steps i.on{background:var(--accent)}
.home{flex:1;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:21px}
.back{display:none} @media (max-width:767px){.back{display:grid}}

/* phase 1 additions */
#scrim{z-index:90} #menu,#picker{z-index:95} #toasts{z-index:96}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:21px}
.kitmsg{min-height:18px;font-size:12px;color:var(--ink3)} .kitmsg.ok{color:var(--ok)} .kitmsg.bad{color:var(--bad)}
.okmark{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--ok)} .okmark svg{width:34px;height:34px}
.tacts{display:flex!important;gap:8px;margin-top:8px}
.toast{cursor:default} .toast span span{white-space:normal}
.row{display:flex;align-items:center;gap:13px;color:var(--ink)} .row>div:first-child{flex:1;min-width:0} .row small{display:block;color:var(--ink3)}
.emo7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center} .emo7 b{display:block;font-size:28px;font-weight:400} .emo7 span{font-size:11px;color:var(--ink2)}
@media (max-width:480px){.emo7{grid-template-columns:repeat(4,1fr)}}
.qr{width:144px;height:144px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);background:#fff;padding:8px;border-radius:8px} .qr i{background:#111} .qr i.o{background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px} .chip{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:13px;background:var(--sel);color:var(--accent);font-weight:600;font-size:12px}
.trust{width:13px;height:13px;color:var(--ok);margin-left:5px;flex:none}
.stamps .msg .gut{opacity:1}
.home .btn{margin:5px}
.meimg{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--panel)} .meimg.l{width:55px;height:55px}
.tabs{overflow-x:auto;scrollbar-width:none} .tabs button{white-space:nowrap}
:root[data-contrast="1"]{--ink2:var(--ink);--ink3:color-mix(in srgb,var(--ink) 78%,var(--bg));--line:color-mix(in srgb,var(--ink) 55%,var(--bg))}
.ri:focus-visible{outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="list" aria-label="Chats">
    <div class="bar">
      <button class="ring" id="meBtn" aria-label="Your menu"></button>
      <h1 class="grow">Chats</h1>
      <button class="icon" id="newBtn" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <label class="search"><span class="sr">Filter chats</span>

    <button data-m="rerr">${I.info}A session that will not open</button><button data-m="evict">${I.trash}Storage cleared by the browser</button><button data-m="update">${I.check}An update is ready</button>
    <button data-m="stress">${I.search}20,000 messages</button><button data-m="onboard">${I.out}First run</button>`;
  document.body.append(mn); const b = anchor.getBoundingClientRect(); mn.style.left = b.left + "px"; mn.style.top = b.bottom + 5 + "px"; mn.style.maxHeight = `calc(100% - ${b.bottom + 13}px)`; mn.style.overflow = "auto";
  mn.onclick = e => { const x = e.target.closest("[data-m]"); if (!x) return; closeOverlay(); ({
    account: () => settings("account"), settings: () => settings(), signout: signOut, offline: toggleOffline, stress, onboard: () => onboard(0), verify: incomingVerify,
    arrive: () => { const r = R("r1"); if (r && !r.invite) incoming(r, "amara", `@${first("me")} one more thing for Thursday: bring the phone build.`); },
    rerr: () => dialog(`<header><h3>Your saved session could not be opened</h3></header><div class="c"><p style="margin:0">Why: the data kept in this browser is damaged or from a newer version.</p><p style="margin:0">What you can do: try again, or clear this device and restore from your recovery kit.</p></div><footer><button class="btn danger" id="rc">Clear this device</button><button class="btn primary" data-close autofocus>Try again</button></footer>`, sc => { $("#rc", sc).onclick = signOut; }),
    evict: () => dialog(`<header><h3>The browser removed this app's data</h3></header><div class="c"><p style="margin:0">Why: browsers clear stored data when space runs low, or when history is cleared.</p><p style="margin:0">What it means: your identity is no longer on this device. Your recovery kit brings it back.</p></div><footer><button class="btn" id="ef">Start fresh</button><button class="btn primary" id="er" autofocus>Restore from a kit</button></footer>`, sc => { $("#er", sc).onclick = () => { closeOverlay(); restore(); }; $("#ef", sc).onclick = () => { closeOverlay(); onboard(0); }; }),
    update: () => toastMsg("An update is ready", "It was checked against its content address before being offered.", [["Update now", () => location.reload()], ["Later", () => {}]], 0)
  })[x.dataset.m](); };
};
settings = function (tab = "account") {
  const sw = (k, t, d) => `<div class="set"><div>${t}<small>${d}</small></div><button class="sw" role="switch" aria-checked="${!!S.set[k]}" data-sw2="${k}" aria-label="${t}"></button></div>`;
  const np = "Notification" in window ? Notification.permission : "none", idx = S.rooms.reduce((a, r) => a + r.ev.length, 0);
  const body = {
    account: `<div class="row"><div style="flex:none">${S.set.avatar ? `<img class="meimg l" src="${S.set.avatar}" alt="">` : av(S.set.name, "l")}</div><div><button class="btn small" data-avpick>Choose a picture</button> ${S.set.avatar ? '<button class="btn small" data-avrm>Remove</button>' : ""}<small>An image up to 300 KB, kept on this device.</small></div></div>
      <label>Name<input type="text" id="acName" value="${esc(S.set.name)}" maxlength="40"></label><div><button class="btn primary" data-acsave>Save name</button></div>
      <div><div class="sect" style="padding:0 0 5px">Your identity</div><div class="addr">${addrOf(S.set.name)}</div></div><div><button class="btn small" data-copyid>Copy identity</button></div>`,
    look: `<div class="set"><div>Theme<small>Follow the device, or choose.</small></div><div class="seg" style="width:233px">${["system", "light", "dark"].map(v => `<button data-theme2="${v}" aria-pressed="${S.set.theme === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join("")}</div></div>
      ${sw("contrast", "High contrast", "Stronger text and lines.")}
      <div class="set"><div>Message text size<small>${S.set.font} px. From 12 to 24.</small></div><button class="btn small" data-font2="-1" aria-label="Smaller">A−</button><button class="btn small" data-font2="1" aria-label="Larger">A+</button></div>`,
    notify: `${sw("notify", "Notifications", "Show a notice when a message arrives in a chat you are not viewing.")}
      <div class="set"><div>System notifications<small>${{ granted: "On. A notice shows when this tab is in the background.", denied: "Blocked by the browser. Allow them in the site settings, then reload.", default: "Off. The browser will ask once.", none: "Not available in this browser." }[np]}</small></div>${np === "default" ? '<button class="btn small primary" data-notifyon>Turn on</button>' : ""}</div>
      <div class="set"><div>New chats notify me about<small>Each chat can be changed under Details.</small></div><div class="seg" style="width:233px;grid-template-columns:1fr 1fr"><button data-deflevel="all" aria-pressed="${S.set.defaultLevel === "all"}">Everything</button><button data-deflevel="mentions" aria-pressed="${S.set.defaultLevel === "mentions"}">Mentions</button></div></div>
      ${sw("showText", "Show message text", "Off shows only that a message arrived.")}${sw("sound", "Play a sound", "A short tone with each notice.")}`,
    prefs: `${sw("h12", "12-hour clock", "Show 3:05 pm instead of 15:05.")}${sw("stamps", "Always show times", "Show a time beside every message.")}${sw("previews", "Message previews", "Show the latest message under each chat.")}
      ${sw("modSend", `Send with ${modKey} Enter`, "Enter then adds a new line.")}${sw("showReceipts", "Show read receipts", "See who has read a message.")}
      ${sw("sendReceipts", "Send read receipts", "Let others see what you have read. Takes effect when the engine is connected.")}${sw("typing", "Send typing notices", "Let others see when you are typing. Takes effect when the engine is connected.")}`,
    crypto: `<div class="row"><div>Recovery kit<small>${ID.kit ? "Saved. It restores your identity on another device." : "Not saved. Losing this device would lose your identity."}</small></div><button class="btn small${ID.kit ? "" : " primary"}" data-kit>${ID.kit ? "Make a new kit" : "Set up"}</button></div>
      <div><div class="sect" style="padding:0 0 5px">This device</div><div class="addr">${addrOf(S.set.name + " device")}</div></div>
      <div><div class="sect" style="padding:0 0 5px">Your other devices</div>${ID.devices.map(d => `<div class="row" style="padding:5px 0"><div>${esc(d.name)}<small>${d.verified ? "Verified" : "Not verified"}</small></div>${d.verified ? I.lock.replace("<svg", '<svg style="color:var(--ok)"') : `<button class="btn small" data-verifydev="${d.id}">Verify</button>`}</div>`).join("")}</div>
      <div class="row"><div>Search index<small id="ixs">${idx.toLocaleString()} messages indexed on this device.</small></div><button class="btn small" data-rebuild>Rebuild</button></div>`,
    keys: `<div class="keys">${[["Find a chat", modKey + " K"], ["Search messages", modKey + " F"], ["Show or hide details", modKey + " ."], ["Open your menu", modKey + " `"], ["Previous or next chat", "Alt ↑ / Alt ↓"], ["Back or forward through chats", "Alt ← / Alt →"], ["Move between areas", "F6"],
      ["Scroll the timeline", "Page Up / Page Down"], ["First or latest message", modKey + " Home / " + modKey + " End"], ["Oldest unread", "Shift Page Up"], ["Jump to latest", "Esc"], ["Send", S.set.modSend ? modKey + " Enter" : "Enter"], ["New line", S.set.modSend ? "Enter" : "Shift Enter"],
      ["Bold, italic, code", modKey + " B / I / E"], ["Edit your last message", "↑ in an empty box"], ["Cancel reply or edit", "Esc"], ["Complete a suggestion", "Enter or Tab"], ["Attach a file", modKey + " Shift U"], ["Move through the chat list", "↓ ↑ then Enter"]].map(([a, k]) => `<span>${a}</span><span class="kbd">${k}</span>`).join("")}</div>`,
    about: `<p style="margin:0;color:var(--ink)">Holo Messenger 0.1.0, prototype. Sample people and messages; nothing is sent anywhere.</p>
      <p style="margin:0">Rules are answered by ${RULES.source}.${RULES.source === "the verified holo" ? ` ${RULES.asked} answers were compared with the built-in copy in ${RULES.ms.toFixed(0)} ms: ${RULES.differ.length ? RULES.differ.length + " differ. " + esc(RULES.differ.slice(0, 3).join("; ")) : "none differ"}.` : ` The holo is not in use: ${esc(RULES.note)}.`}</p>
      <p style="margin:0">${S.perf.open != null ? `Measured on this device, script time: last chat opened in ${S.perf.open.toFixed(1)} ms; last timeline update ${S.perf.draw.toFixed(1)} ms, building ${S.perf.built} of ${S.perf.rows} rows shown from ${S.perf.total} messages${S.perf.send != null ? `; last send ${S.perf.send.toFixed(1)} ms` : ""}.` : ""}</p>
      <p style="margin:0">This page asks no server for anything; it loads only its own files. There is no account. Your identity is a key held on this device.</p>
      <p style="margin:0">Licence: MIT or Apache 2.0, your choice. This page contains no third-party code.</p>` }[tab];
  dialog(`<header><h3>Settings</h3><button class="icon" data-close aria-label="Close">${I.x}</button></header><div class="tabs" role="tablist">${[["account", "Profile"], ["look", "Appearance"], ["notify", "Notifications"], ["prefs", "Preferences"], ["crypto", "Encryption"], ["keys", "Keyboard"], ["about", "About"]].map(([k, t]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join("")}</div><div class="c" style="padding-top:21px" data-stab="${tab}">${body}</div>`);
};
const avFile = Object.assign(document.createElement("input"), { type: "file", accept: "image/*", hidden: true }); document.body.append(avFile);
avFile.onchange = () => { const f = avFile.files[0]; avFile.value = ""; if (!f) return;
  if (f.size > 300000) { confirmDlg("That picture is too large", `<p style="margin:0">Choose an image under 300 KB. It is kept in this browser, which has little room.</p>`, "OK", "primary", () => settings("account")); return; }
  const fr = new FileReader(); fr.onload = () => { S.set.avatar = fr.result; applySet(); drawAll(); settings("account"); }; fr.readAsDataURL(f); };

/* ---------- clicks for everything above ---------- */
const redraw = () => { saveDraft(); drawAll(); };
document.addEventListener("click", e => {
  const q = s => e.target.closest(s); let b;
  const tabNow = () => { const c = $("[data-stab]"); return c ? c.dataset.stab : "account"; };
  if (q("[data-take]")) { holdsLock = true; if (lockCh) lockCh.postMessage("take"); lockScreen(null); }
  else if (q("[data-kitoff]")) { ID.bannerOff = true; saveId(); drawList(); }
  else if (q("[data-kit]")) createKit();
  else if ((b = q("[data-sw2]"))) { const k = b.dataset.sw2, t = tabNow(); S.set[k] = !S.set[k]; applySet(); redraw(); settings(t); }
  else if ((b = q("[data-theme2]"))) { S.set.theme = b.dataset.theme2; applySet(); settings("look"); }
  else if ((b = q("[data-font2]"))) { S.set.font = Math.max(12, Math.min(24, S.set.font + +b.dataset.font2)); applySet(); settings("look"); }   // Settings.fontSize
  else if ((b = q("[data-deflevel]"))) { S.set.defaultLevel = b.dataset.deflevel; applySet(); settings("notify"); }
  else if (q("[data-notifyon]")) askNotify(() => settings("notify"));
  else if ((b = q("[data-verifydev]"))) { const d = ID.devices.find(x => x.id === b.dataset.verifydev); verifyFlow({ kind: "device", id: d.id, name: d.name, onDone: () => settings("crypto") }); }
  else if (q("[data-rebuild]")) { const s = $("#ixs"); s.textContent = "Rebuilding."; setTimeout(() => { if ($("#ixs")) $("#ixs").textContent = S.rooms.reduce((a, r) => a + r.ev.length, 0).toLocaleString() + " messages indexed. Rebuilt just now."; }, 500); }
  else if (q("[data-acsave]")) { const v = $("#acName").value.trim(); if (v) { S.set.name = v; U.me.n = v; applySet(); redraw(); settings("account"); toastMsg("Name saved", "People see your new name on your next message.", [], 3000); } }
  else if (q("[data-avpick]")) avFile.click();
  else if (q("[data-avrm]")) { S.set.avatar = null; applySet(); drawAll(); settings("account"); }
  else if (q("[data-copyid]")) { if (navigator.clipboard) navigator.clipboard.writeText(addrOf(S.set.name)).then(() => toastMsg("Identity copied", "Share it so people can start a chat with you.", [], 3000)).catch(() => {}); }
  else if (q("[data-invite]")) invitePeople();
  else if (q("[data-unread]")) { const r = R(S.cur), e2 = [...r.ev].reverse().find(x => x.t === "m" && x.from !== "me" && !x.del); if (e2) { r.lastRead = e2.ts - 1; saveDraft(); S.cur = null; $("#app").classList.remove("in-room"); S.panel = false; drawRoom(); drawList(); drawPanel(); } }
  else if (q("[data-home]")) newChat();
  else if ((b = q("[data-avbig]"))) { const id = b.dataset.avbig, n = U[id].n; dialog(`<header><h3>${esc(n)}</h3><button class="icon" data-close aria-label="Close">${I.x}</button></header><div class="c" style="align-items:center">${id === "me" && S.set.avatar ? `<img src="${S.set.avatar}" alt="" style="max-width:100%;max-height:44vh;border-radius:8px">` : `<span class="av" style="width:233px;height:233px;font-size:89px;background:hsl(${hue(n)} 42% 44%)">${esc(n[0].toUpperCase())}</span>`}</div>`); }
});
/* right-click or long-press a chat: mark read or unread, details, leave */
document.addEventListener("contextmenu", e => {
  const it = e.target.closest(".ri[data-room]"); if (!it) return; e.preventDefault(); closeOverlay();
  const r = R(it.dataset.room), n = unread(r), mn = document.createElement("div"); mn.id = "menu";
  mn.innerHTML = `<button data-c="read">${I.check}${n ? "Mark as read" : "Mark as unread"}</button><button data-c="details">${I.info}Details</button><button data-c="leave">${I.out}Leave</button>`;
  document.body.append(mn); mn.style.left = Math.min(e.clientX, innerWidth - 240) + "px"; mn.style.top = Math.min(e.clientY, innerHeight - 130) + "px";
  mn.onclick = x => { const c = x.target.closest("[data-c]"); if (!c) return; closeOverlay(); const a = c.dataset.c;
    if (a === "read") { if (n) r.lastRead = Date.now(); else { const e2 = [...r.ev].reverse().find(y => y.t === "m" && y.from !== "me" && !y.del); if (e2) r.lastRead = e2.ts - 1; } drawList(); }
    else { openRoom(r.id); S.panel = true; drawPanel(); if (a === "leave") $("#panel [data-leave]").click(); } };
});

/* ---------- keys: history, areas, the chat list, the timeline, formatting ---------- */
document.addEventListener("keydown", e => {
  const mod = isMac ? e.metaKey : e.ctrlKey, k = e.key, t = e.target, typing = t.tagName === "INPUT" || t.tagName === "TEXTAREA", over = $("#scrim") || $("#onb") || $("#lock");
  if (over) return;
  if (e.altKey && (k === "ArrowLeft" || k === "ArrowRight")) { e.preventDefault(); histGo(k === "ArrowLeft" ? -1 : 1); return; }
  if (k === "F6") { e.preventDefault(); const areas = [$("#filter"), $("#tl"), $("#ta"), $("#panel:not([hidden]) button")].filter(Boolean);   // Navigation.nextLandmark
    const i = areas.findIndex(a => a === document.activeElement || a.contains(document.activeElement)); areas[(i + (e.shiftKey ? areas.length - 1 : 1)) % areas.length].focus(); return; }
  if (mod && k === "`") { e.preventDefault(); userMenu($("#meBtn")); return; }
  if (mod && e.shiftKey && k.toLowerCase() === "u" && S.cur) { e.preventDefault(); $("#file").click(); return; }
  if (t.id === "filter" && k === "ArrowDown") { const f = $("#rooms .ri"); if (f) { e.preventDefault(); f.focus(); } return; }
  if (t.classList && t.classList.contains("ri") && (k === "ArrowDown" || k === "ArrowUp")) { e.preventDefault(); const l = [...document.querySelectorAll("#rooms .ri")], i = l.indexOf(t), n = l[i + (k === "ArrowDown" ? 1 : -1)]; n ? n.focus() : k === "ArrowUp" && $("#filter").focus(); return; }   // Navigation.moveDown, canMoveUp
  if ((t.id === "filter" || (t.classList && t.classList.contains("ri"))) && k === "Escape") { $("#filter").value = ""; drawList(); $("#filter").focus(); return; }
  if (t.id === "ta" && mod && !e.shiftKey && "bie".includes(k.toLowerCase()) && k.length === 1) { e.preventDefault(); const w = { b: "**", i: "*", e: "`" }[k.toLowerCase()], a = t.selectionStart, z = t.selectionEnd;
    t.setRangeText(w + t.value.slice(a, z) + w, a, z, "select"); if (a === z) t.setSelectionRange(a + w.length, a + w.length); grow(); return; }
  const tl = $("#tl"), r = R(S.cur); if (!tl || !r) return;
  if (k === "PageUp" && e.shiftKey) { e.preventDefault(); const u = r.ev.find(x => x.t === "m" && x.from !== "me" && !x.del && x.ts > (r.seenLine || 0)); if (u) jump(u.id); return; }
  if (!typing || !t.value) { if (k === "PageUp" || k === "PageDown") { e.preventDefault(); tl.scrollTop += (k === "PageDown" ? 1 : -1) * tl.clientHeight * .9; return; } }
  if (!typing && mod && k === "Home") { e.preventDefault(); r.lo = 0; r.hi = Math.min(shownEv(r).length, WIN) >= shownEv(r).length ? null : WIN; drawTimeline(); tl.scrollTop = 0; return; }
  if (!typing && mod && k === "End") { e.preventDefault(); drawTimeline(true); return; }
  if (k === "Escape" && !typing && !$("#menu") && !$("#picker")) drawTimeline(true);
});
addEventListener("error", ev => { if ($("#scrim") || !ev.message) return;   // a failure shows a way out, not a blank page
  dialog(`<header><h3>Something went wrong</h3></header><div class="c"><p style="margin:0">Part of the page failed to draw. Your messages are not affected.</p><p class="addr" style="margin:0">${esc(ev.message)}</p></div><footer><button class="btn" data-close>Carry on</button><button class="btn primary" onclick="location.reload()" autofocus>Reload</button></footer>`); });

/* ---------- start (Session.rootView): unsupported, first run, or the chats ---------- */
applySet(); drawAll();
const supported = !!(window.CSS && CSS.supports && CSS.supports("display", "grid") && window.crypto && crypto.getRandomValues && "replaceChildren" in document.body);
if (!supported) stage(`<h2>This browser is too old.</h2><p>Holo Messenger needs a current version of Chrome, Edge, Firefox or Safari.</p><button class="btn primary" onclick="location.reload()">Try again</button>`);
else if (!ID.created) onboard(0);
else { const ui = store.get("hm-ui", null); if (ui && R(ui.cur) && panes(innerWidth) > 1) { openRoom(ui.cur); if (ui.panel) { S.panel = true; drawPanel(); } } }
</script>
